/* ---------- 6. Подтемы и декомпозиция ---------- */
function DecompAdmin({ st, update, focusId }) {
  const [id, setId] = useState(focusId || (st.reqs[0] && st.reqs[0].id));
  const r = st.reqs.find((x) => x.id === id);
  const [newName, setNewName] = useState('');
  const mut = (fn) => update((s) => { const x = s.reqs.find((y) => y.id === id); fn(x); x.updated = TODAY; });
  const move = (i, d) => mut((x) => { const j = i + d; if (j < 0 || j >= x.subtopics.length) return; [x.subtopics[i], x.subtopics[j]] = [x.subtopics[j], x.subtopics[i]]; });
  const add = () => { const n = newName.trim(); if (!n) return; mut((x) => { x.subtopics.push({ id: 'S' + uid(), name: n, level: 2, required: false }); }); setNewName(''); };
  return html`<div>
    <${SecHead} title="Подтемы и декомпозиция" sub="Разбейте требование на проверяемые подтемы с уровнем 0–5. Уровень кандидата засчитывается только с подтверждением тестом, проектом, опытом или ручной оценкой." />
    <div className="flex flex-wrap gap-1.5">${[...st.reqs].sort((a, b) => b.subtopics.length - a.subtopics.length || a.name.localeCompare(b.name, 'ru')).map((x) => html`<${Chip} key=${x.id} active=${x.id === id} onClick=${() => setId(x.id)}>${x.name}<span className="opacity-70 tabular-nums">${x.subtopics.length}</span><//>`)}</div>
    ${r && html`<div className="mt-4 grid gap-5 2xl:grid-cols-[1fr_380px]">
      <div className="rounded-2xl border border-line bg-surface p-4">
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <h2 className="font-display text-lg font-semibold">${r.name}</h2>
          <span className="text-sm text-muted">подтем ${r.subtopics.length}: обязательных ${r.subtopics.filter((s) => s.required).length}, желательных ${r.subtopics.filter((s) => !s.required).length}</span>
        </div>
        <div className="mt-3 grid gap-2">
          ${r.subtopics.length === 0 && html`<div className="rounded-lg border border-dashed border-line p-3 text-sm text-muted">Подтем пока нет. Добавьте первую ниже.</div>`}
          ${r.subtopics.map((s, i) => html`<div key=${s.id} className="grid items-center gap-2 rounded-lg border border-line p-2 sm:grid-cols-[minmax(0,1fr)_180px_auto_auto]">
            <${Input} aria-label="Название подтемы" value=${s.name} onChange=${(e) => mut((x) => { x.subtopics[i].name = e.target.value; })} />
            <${Select} aria-label="Требуемый уровень" value=${String(s.level)} options=${SKILL_LEVELS.map((n, k) => ({ id: String(k), name: `${k} — ${n}` }))} onChange=${(v) => mut((x) => { x.subtopics[i].level = Number(v); })} />
            <${Check} checked=${s.required} onChange=${(v) => mut((x) => { x.subtopics[i].required = v; })} label="Обязательная" />
            <div className="flex">
              <${IconBtn} icon="up" label="Выше" disabled=${i === 0} onClick=${() => move(i, -1)} />
              <${IconBtn} icon="down" label="Ниже" disabled=${i === r.subtopics.length - 1} onClick=${() => move(i, 1)} />
              <${IconBtn} icon="trash" label="Удалить подтему" onClick=${() => mut((x) => { x.subtopics.splice(i, 1); })} />
            </div>
          </div>`)}
        </div>
        <div className="mt-3 flex gap-2">
          <${Input} value=${newName} placeholder="Новая подтема" aria-label="Новая подтема" onChange=${(e) => setNewName(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') add(); }} />
          <${Btn} kind="primary" onClick=${add}><${Icon} name="plus" />Добавить<//>
        </div>
        <dl className="mt-5 grid gap-3 text-sm sm:grid-cols-2">
          <div><dt className="text-muted">Тестовые вопросы</dt><dd>${r.questions.length ? html`<ul className="list-disc pl-4">${r.questions.map((q) => html`<li key=${q}>${q}</li>`)}</ul>` : '—'}</dd></div>
          <div><dt className="text-muted">Практические задания</dt><dd>${r.tasks.length ? html`<ul className="list-disc pl-4">${r.tasks.map((q) => html`<li key=${q}>${q}</li>`)}</ul>` : '—'}</dd></div>
          <div><dt className="text-muted">Рекомендуемые проекты</dt><dd>${r.projects.length ? html`<ul className="list-disc pl-4">${r.projects.map((q) => html`<li key=${q}>${q}</li>`)}</ul>` : '—'}</dd></div>
          <div><dt className="text-muted">Критерии проверки</dt><dd>${r.criteria || '—'}</dd></div>
        </dl>
      </div>
      <div>
        <h3 className="font-display font-semibold">Как это видит кандидат</h3>
        <p className="mb-2 text-sm text-muted">${st.candidateDone ? 'По текущей анкете кандидата.' : 'Анкета кандидата не заполнена — статусы будут красными или серыми.'}</p>
        <div className="grid gap-2"><${StatusLegend} /><${ReqDecomp} st=${st} cand=${st.candidate} req=${{ id: r.id, name: r.name, mandatory: r.mandatory, level: r.level }} /></div>
      </div>
    </div>`}
  </div>`;
}

/* ---------- 7. Курсы ---------- */
function CoursesAdmin({ st, update, toast }) {
  const empty = { skill: '', subtopic: '', level: '', language: '', cost: '', format: '', provider: '', cert: '', rating: '', type: '', q: '' };
  const [f, setF] = useState(empty);
  const [edit, setEdit] = useState(null);
  const set = (p) => setF({ ...f, ...p });
  const uniq = (fn) => [...new Set(st.courses.flatMap(fn).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
  const subOpts = uniq((c) => (!f.skill || c.skills.includes(f.skill) ? c.subtopics : []));
  const list = st.courses.filter((c) => {
    if (f.q && !norm(c.title + c.description + c.provider).includes(norm(f.q))) return false;
    if (f.skill && !c.skills.includes(f.skill)) return false;
    if (f.subtopic && !c.subtopics.includes(f.subtopic)) return false;
    if (f.level && c.difficulty !== f.level) return false;
    if (f.language && c.language !== f.language) return false;
    if (f.cost === 'free' && !c.free) return false;
    if (f.cost === 'paid' && c.free) return false;
    if (f.format && c.format !== f.format) return false;
    if (f.provider && c.provider !== f.provider) return false;
    if (f.cert === '1' && !c.certificate) return false;
    if (f.cert === '0' && c.certificate) return false;
    if (f.rating && !((c.rating || 0) >= Number(f.rating))) return false;
    if (f.type && c.type !== f.type) return false;
    return true;
  });
  const save = (c) => { update((s) => { c.updated = TODAY; const i = s.courses.findIndex((x) => x.id === c.id); if (i >= 0) s.courses[i] = c; else s.courses.push(c); }); setEdit(null); toast('Материал сохранён'); };
  const del = (c) => { update((s) => { s.courses = s.courses.filter((x) => x.id !== c.id); s.reqs.forEach((r) => { r.courseIds = r.courseIds.filter((x) => x !== c.id); }); }); toast('Материал удалён'); };
  return html`<div>
    <${SecHead} title="Курсы и материалы" sub="Ссылки ведут на реальные ресурсы; рейтинг — внутренняя оценка куратора в демо-данных.">
      <${Btn} kind="primary" onClick=${() => setEdit(c({ id: nextId(st.courses, 'C-', 0), title: '', provider: '', url: '', updated: TODAY, rating: null }))}><${Icon} name="plus" />Добавить материал<//>
    <//>
    <div className="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4">
      <div className="col-span-2 sm:col-span-3 lg:col-span-4"><${Input} type="search" placeholder="Поиск по названию, описанию, провайдеру" aria-label="Поиск курсов" value=${f.q} onChange=${(e) => set({ q: e.target.value })} /></div>
      <${Select} aria-label="Навык" value=${f.skill} placeholder="Любой навык" options=${uniq((x) => x.skills)} onChange=${(v) => set({ skill: v, subtopic: '' })} />
      <${Select} aria-label="Подтема" value=${f.subtopic} placeholder="Любая подтема" options=${subOpts} onChange=${(v) => set({ subtopic: v })} />
      <${Select} aria-label="Уровень" value=${f.level} placeholder="Любой уровень" options=${DIFFICULTY} onChange=${(v) => set({ level: v })} />
      <${Select} aria-label="Язык" value=${f.language} placeholder="Любой язык" options=${uniq((x) => [x.language])} onChange=${(v) => set({ language: v })} />
      <${Select} aria-label="Стоимость" value=${f.cost} placeholder="Любая стоимость" options=${[{ id: 'free', name: 'Бесплатные' }, { id: 'paid', name: 'Платные' }]} onChange=${(v) => set({ cost: v })} />
      <${Select} aria-label="Формат" value=${f.format} placeholder="Любой формат" options=${uniq((x) => [x.format])} onChange=${(v) => set({ format: v })} />
      <${Select} aria-label="Провайдер" value=${f.provider} placeholder="Любой провайдер" options=${uniq((x) => [x.provider])} onChange=${(v) => set({ provider: v })} />
      <${Select} aria-label="Сертификат" value=${f.cert} placeholder="Сертификат: неважно" options=${[{ id: '1', name: 'С сертификатом' }, { id: '0', name: 'Без сертификата' }]} onChange=${(v) => set({ cert: v })} />
      <${Select} aria-label="Рейтинг" value=${f.rating} placeholder="Любой рейтинг" options=${[{ id: '4', name: 'от 4.0' }, { id: '4.5', name: 'от 4.5' }, { id: '4.8', name: 'от 4.8' }]} onChange=${(v) => set({ rating: v })} />
      <${Select} aria-label="Тип" value=${f.type} placeholder="Любой тип" options=${COURSE_TYPES} onChange=${(v) => set({ type: v })} />
      <${Btn} onClick=${() => setF(empty)}>Сбросить фильтры<//>
    </div>
    <div className="mt-2 text-sm text-muted">Найдено: ${list.length}</div>
    <div className="mt-3 grid gap-3 md:grid-cols-2">
      ${list.length === 0 && html`<div className="rounded-xl border border-dashed border-line p-4 text-sm text-muted md:col-span-2">Под фильтры ничего не подходит. Сбросьте часть условий.</div>`}
      ${list.map((x) => html`<article key=${x.id} className="rounded-2xl border border-line bg-surface p-4">
        <div className="flex items-start justify-between gap-2">
          <div className="min-w-0"><h3 className="font-semibold leading-snug"><a className="hover:text-accent hover:underline" href=${x.url} target="_blank" rel="noopener noreferrer">${x.title}</a></h3>
            <div className="text-sm text-muted">${x.provider}, ${x.type}</div></div>
          <div className="flex shrink-0"><${IconBtn} icon="edit" label="Редактировать" onClick=${() => setEdit(JSON.parse(JSON.stringify(x)))} /><${IconBtn} icon="trash" label="Удалить" onClick=${() => del(x)} /></div>
        </div>
        ${x.description && html`<p className="mt-2 text-sm">${x.description}</p>`}
        <div className="mt-2 flex flex-wrap gap-1.5 text-sm">
          <${Chip}>${x.difficulty}<//><${Chip}>${x.language}<//><${Chip}>≈${x.duration} ч<//><${Chip}>${x.format}<//>
          <${Chip} tone=${x.free ? 'ok' : 'neutral'}>${x.free ? 'бесплатно' : fmtMoney(x.cost) + ' ₽'}<//>
          ${x.certificate && html`<${Chip} tone="accent">сертификат<//>`}
          ${x.rating != null && html`<${Chip}>оценка ${x.rating}<//>`}
          <${Chip} tone=${x.availability === 'доступен' ? 'ok' : x.availability === 'недоступен' ? 'bad' : 'warn'}>${x.availability}<//>
        </div>
        <div className="mt-2 text-sm"><span className="text-muted">Навыки: </span>${x.skills.join(', ') || '—'}</div>
        ${x.subtopics.length > 0 && html`<div className="text-sm"><span className="text-muted">Подтемы: </span>${x.subtopics.join(', ')}</div>`}
        <div className="mt-1 text-xs text-muted">Публикация: ${fmtDate(x.published)}, обновлено: ${fmtDate(x.updated)}</div>
      </article>`)}
    </div>
    ${edit && html`<${CourseForm} st=${st} course=${edit} onClose=${() => setEdit(null)} onSave=${save} />`}
  </div>`;
}

function CourseForm({ st, course, onClose, onSave }) {
  const [x, setX] = useState(course);
  const set = (p) => setX({ ...x, ...p });
  const allSubs = [...new Set(st.reqs.filter((r) => x.skills.some((s) => norm(s) === norm(r.name))).flatMap((r) => r.subtopics.map((s) => s.name)))];
  return html`<${Modal} wide title=${course.title ? `Материал: ${course.title}` : 'Новый материал'} onClose=${onClose}
    footer=${html`<${Btn} onClick=${onClose}>Отмена<//><${Btn} kind="primary" disabled=${!x.title.trim() || !x.url.trim()} onClick=${() => onSave(x)}>Сохранить<//>`}>
    <div className="grid gap-3 sm:grid-cols-2">
      <${Field} label="Название"><${Input} value=${x.title} onChange=${(e) => set({ title: e.target.value })} /><//>
      <${Field} label="Провайдер"><${Input} value=${x.provider} onChange=${(e) => set({ provider: e.target.value })} /><//>
      <${Field} className="sm:col-span-2" label="Ссылка"><${Input} type="url" value=${x.url} onChange=${(e) => set({ url: e.target.value })} placeholder="https://" /><//>
      <${Field} className="sm:col-span-2" label="Описание"><${Textarea} value=${x.description} onChange=${(e) => set({ description: e.target.value })} /><//>
      <${Field} label="Тип"><${Select} value=${x.type} options=${COURSE_TYPES} onChange=${(v) => set({ type: v })} /><//>
      <${Field} label="Уровень сложности"><${Select} value=${x.difficulty} options=${DIFFICULTY} onChange=${(v) => set({ difficulty: v })} /><//>
      <${Field} label="Язык"><${Input} value=${x.language} onChange=${(e) => set({ language: e.target.value })} /><//>
      <${Field} label="Формат"><${Input} value=${x.format} onChange=${(e) => set({ format: e.target.value })} /><//>
      <${Field} label="Длительность, часов"><${Input} type="number" min="0" value=${x.duration} onChange=${(e) => set({ duration: Number(e.target.value) || 0 })} /><//>
      <${Field} label="Стоимость, ₽"><${Input} type="number" min="0" value=${x.cost} onChange=${(e) => { const cost = Number(e.target.value) || 0; set({ cost, free: cost === 0 }); }} /><//>
      <${Field} label="Оценка (0–5)"><${Input} type="number" min="0" max="5" step="0.1" value=${x.rating ?? ''} onChange=${(e) => set({ rating: e.target.value === '' ? null : Number(e.target.value) })} /><//>
      <${Field} label="Статус доступности"><${Select} value=${x.availability} options=${['доступен', 'проверить', 'недоступен']} onChange=${(v) => set({ availability: v })} /><//>
      <${Field} label="Дата публикации"><${Input} type="date" value=${x.published} onChange=${(e) => set({ published: e.target.value })} /><//>
      <div className="flex flex-wrap items-end gap-4 pb-2">
        <${Check} checked=${x.free} onChange=${(v) => set({ free: v, cost: v ? 0 : x.cost })} label="Бесплатно" />
        <${Check} checked=${x.certificate} onChange=${(v) => set({ certificate: v })} label="Есть сертификат" />
      </div>
      <${Field} className="sm:col-span-2" label="Целевые навыки"><${TagInput} listId="c-skills" values=${x.skills} suggestions=${st.reqs.map((r) => r.name)} onChange=${(v) => set({ skills: v })} /><//>
      <${Field} className="sm:col-span-2" label="Связанные подтемы"><${TagInput} listId="c-subs" values=${x.subtopics} suggestions=${allSubs} onChange=${(v) => set({ subtopics: v })} /><//>
    </div>
  <//>`;
}

/* ---------- Источники ---------- */
function SourcesAdmin({ st, update, toast }) {
  const [edit, setEdit] = useState(null);
  const count = (id) => st.vacancies.filter((v) => v.sourceId === id).length;
  const save = (s0) => { update((s) => { const i = s.sources.findIndex((x) => x.id === s0.id); if (i >= 0) s.sources[i] = s0; else s.sources.push(s0); }); setEdit(null); toast('Источник сохранён'); };
  return html`<div>
    <${SecHead} title="Источники" sub="Откуда берутся вакансии. Источник выводится в карточке и в таблице вакансий.">
      <${Btn} kind="primary" onClick=${() => setEdit({ id: 'SRC-' + uid(), name: '', url: '', type: '' })}><${Icon} name="plus" />Добавить источник<//>
    <//>
    <div className="overflow-x-auto rounded-xl border border-line bg-surface"><table className="w-full text-sm">
      <thead className="bg-sunken text-muted"><tr>${['Название', 'Тип', 'Сайт', 'Вакансий', 'Действия'].map((h) => html`<th key=${h} className="px-2 py-2 text-left font-medium whitespace-nowrap">${h}</th>`)}</tr></thead>
      <tbody>${st.sources.map((s) => html`<tr key=${s.id} className="border-t border-line">
        <td className="px-2 py-1.5 font-medium">${s.name}</td><td className="px-2 py-1.5">${s.type || '—'}</td>
        <td className="px-2 py-1.5">${s.url ? html`<a className="text-accent hover:underline" href=${s.url} target="_blank" rel="noopener noreferrer">${s.url.replace(/^https?:\/\//, '')}</a>` : '—'}</td>
        <td className="px-2 py-1.5 tabular-nums">${count(s.id)}</td>
        <td className="px-1 py-1 whitespace-nowrap"><${IconBtn} icon="edit" label="Редактировать" onClick=${() => setEdit({ ...s })} />
          <${IconBtn} icon="trash" label="Удалить" onClick=${() => { if (count(s.id)) { toast('К источнику привязаны вакансии — сначала смените у них источник'); return; } update((x) => { x.sources = x.sources.filter((y) => y.id !== s.id); }); toast('Источник удалён'); }} /></td>
      </tr>`)}</tbody></table></div>
    ${edit && html`<${Modal} title=${edit.name ? `Источник: ${edit.name}` : 'Новый источник'} onClose=${() => setEdit(null)}
      footer=${html`<${Btn} onClick=${() => setEdit(null)}>Отмена<//><${Btn} kind="primary" disabled=${!edit.name.trim()} onClick=${() => save(edit)}>Сохранить<//>`}>
      <div className="grid gap-3">
        <${Field} label="Название"><${Input} value=${edit.name} onChange=${(e) => setEdit({ ...edit, name: e.target.value })} /><//>
        <${Field} label="Тип"><${Input} value=${edit.type} onChange=${(e) => setEdit({ ...edit, type: e.target.value })} placeholder="Агрегатор, партнёр, Telegram-канал" /><//>
        <${Field} label="Сайт"><${Input} type="url" value=${edit.url} onChange=${(e) => setEdit({ ...edit, url: e.target.value })} placeholder="https://" /><//>
      </div>
    <//>`}
  </div>`;
}

/* ---------- Настройки ---------- */
function SettingsAdmin({ st, update, toast }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const fileRef = useRef(null);
  const [canSave, setCanSave] = useState(false);
  useEffect(() => { downloadsReady.then((a) => setCanSave(!!a)); }, []);
  const ordered = st.grades.filter((g) => g.id !== 'none').sort((a, b) => a.order - b.order);
  const moveGrade = (i, d) => update((s) => {
    const list = s.grades.filter((g) => g.id !== 'none').sort((a, b) => a.order - b.order);
    const j = i + d; if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    list.forEach((g, k) => { g.order = k + 1; });
  });
  const W = st.settings.weights;
  const wLabels = { reqMatch: 'Совпадение обязательного навыка', desMatch: 'Совпадение желательного навыка', subject: 'Совпадение предмета', grade: 'Соответствие уровня', reqMiss: 'Нет обязательного навыка', desMiss: 'Нет желательного навыка', gap: 'Разрыв уровня ≥ 2 по обязательному навыку' };
  const importJson = (file) => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!data.vacancies || !data.reqs || !data.grades) throw new Error('bad');
        update((s) => { Object.assign(s, data); });
        toast('Данные загружены');
      } catch (e) { toast('Файл не похож на экспорт этого сайта'); }
    };
    fr.readAsText(file);
  };
  return html`<div className="grid gap-6">
    <${SecHead} title="Настройки" />
    <section className="rounded-2xl border border-line bg-surface p-4">
      <h2 className="font-display text-lg font-semibold">Справочник грейдов</h2>
      <p className="mt-1 text-sm text-muted">Порядковый номер используется в фильтрах и в расчёте соответствия. «Не указан» всегда имеет порядок 0 и не участвует в баллах.</p>
      <div className="mt-3 grid gap-2">
        ${ordered.map((g, i) => html`<div key=${g.id} className="flex items-center gap-2">
          <span className="w-8 text-center font-display font-semibold tabular-nums text-muted">${g.order}</span>
          <div className="flex-1"><${Input} aria-label=${`Название грейда ${g.order}`} value=${g.name} onChange=${(e) => update((s) => { s.grades.find((x) => x.id === g.id).name = e.target.value; })} /></div>
          <${IconBtn} icon="up" label="Выше" disabled=${i === 0} onClick=${() => moveGrade(i, -1)} />
          <${IconBtn} icon="down" label="Ниже" disabled=${i === ordered.length - 1} onClick=${() => moveGrade(i, 1)} />
        </div>`)}
        <div className="flex items-center gap-2"><span className="w-8 text-center font-display font-semibold text-muted">0</span>
          <div className="flex-1"><${Input} aria-label="Название для неуказанного грейда" value=${gradeById(st, 'none').name} onChange=${(e) => update((s) => { s.grades.find((x) => x.id === 'none').name = e.target.value; })} /></div><span className="w-16"></span></div>
      </div>
    </section>
    <section className="rounded-2xl border border-line bg-surface p-4">
      <h2 className="font-display text-lg font-semibold">Балльная модель</h2>
      <p className="mt-1 text-sm text-muted">Значения по умолчанию взяты из ТЗ: +3, +1, +1, +2, −3, −1.</p>
      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        ${Object.keys(wLabels).map((k) => html`<${Field} key=${k} label=${wLabels[k]}><${Input} type="number" step="1" value=${W[k]} onChange=${(e) => update((s) => { s.settings.weights[k] = Number(e.target.value) || 0; })} /><//>`)}
        <div className="flex items-end pb-2"><${Check} checked=${st.settings.useGap} onChange=${(v) => update((s) => { s.settings.useGap = v; })} label="Учитывать разрыв уровней" /></div>
        <${Field} label="Минимальное соответствие вакансии для показа кандидату, %"><${Input} type="number" min="0" max="100" value=${st.settings.minVacancyMatch ?? 25} onChange=${(e) => update((s) => { s.settings.minVacancyMatch = Math.max(0, Math.min(100, Number(e.target.value) || 0)); })} /><//>
        <${Field} label="Строк на странице таблицы"><${Input} type="number" min="3" max="50" value=${st.settings.pageSize} onChange=${(e) => update((s) => { s.settings.pageSize = Math.max(3, Number(e.target.value) || 8); })} /><//>
      </div>
      <div className="mt-3"><${Btn} onClick=${() => { update((s) => { s.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }); toast('Веса сброшены к значениям из ТЗ'); }}>Вернуть веса по умолчанию<//></div>
    </section>
    <section className="rounded-2xl border border-line bg-surface p-4">
      <h2 className="font-display text-lg font-semibold">Данные</h2>
      <p className="mt-1 text-sm text-muted">Всё хранится в браузере этого устройства. Исходный набор — 84 вакансии и 539 требований из файла «Анализ вакансий и навыков».</p>
      <div className="mt-3 flex flex-wrap gap-2">
        ${canSave && html`<${Btn} onClick=${async () => { const { mode, ...data } = st; toast((await offerFile(`pervaya-poziciya-${TODAY}.json`, JSON.stringify(data, null, 2))).msg); }}>Экспорт в JSON<//>`}
        <${Btn} onClick=${() => fileRef.current && fileRef.current.click()}>Импорт из JSON<//>
        <input ref=${fileRef} type="file" accept="application/json,.json" className="hidden" onChange=${(e) => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; }} />
        <${Btn} onClick=${() => { update((s) => { s.candidate = emptyCandidate(); s.candidateDone = false; }); toast('Анкета кандидата очищена'); }}>Очистить анкету<//>
        <${Btn} kind="danger" onClick=${() => setConfirmReset(true)}>Вернуть данные из файла<//>
      </div>
    </section>
    ${confirmReset && html`<${Modal} title="Вернуть данные из файла?" onClose=${() => setConfirmReset(false)} footer=${html`
      <${Btn} onClick=${() => setConfirmReset(false)}>Отмена<//>
      <${Btn} kind="danger" onClick=${() => { update((s) => { const d = demoState(); Object.keys(s).forEach((k) => delete s[k]); Object.assign(s, d, { mode: 'admin' }); }); setConfirmReset(false); toast('Исходные данные восстановлены'); }}>Вернуть<//>`}>
      <p>Все изменения вакансий, требований, курсов, настроек и анкета будут заменены исходным набором из файла.</p>
    <//>`}
  </div>`;
}
/* ===================== Приложение ===================== */
function App() {
  const [st, setSt] = useState(loadState);
  const [editing, setEditing] = useState(false);
  const [msg, setMsg] = useState('');
  const tRef = useRef(null);
  const update = (fn) => setSt((prev) => { const n = JSON.parse(JSON.stringify(prev)); fn(n); return n; });
  useEffect(() => { saveState(st); }, [st]);
  const toast = (m) => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(''), 3200); };
  const setMode = (m) => { update((s) => { s.mode = m; }); window.scrollTo({ top: 0 }); };
  const showWizard = !st.candidateDone || editing;

  return html`<div className="min-h-full">
    <header className="sticky z-40 border-b border-line bg-glass backdrop-blur" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
      <div className="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-2.5">
        <a href="#" onClick=${(e) => { e.preventDefault(); setMode('candidate'); }} className="flex items-center gap-2 min-w-0">
          <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-accent text-onaccent font-display text-sm font-semibold" aria-hidden="true">1</span>
          <span className="hidden min-[440px]:inline font-display font-semibold truncate">Первая позиция</span>
        </a>
        <div className="flex rounded-xl border border-line bg-sunken p-1" role="group" aria-label="Режим работы">
          ${[['candidate', 'Кандидат'], ['admin', 'Администратор']].map(([id, name]) => html`<button key=${id} type="button" aria-pressed=${st.mode === id} onClick=${() => setMode(id)}
            className=${cx('rounded-lg px-3 sm:px-4 py-1.5 text-[15px] font-medium transition-colors', st.mode === id ? 'bg-accent text-onaccent shadow-sm' : 'text-ink hover:text-accent')}>${name}</button>`)}
        </div>
      </div>
    </header>
    <main className="px-4 py-6 sm:py-8">
      ${st.mode === 'candidate'
        ? (showWizard
          ? html`<${Wizard} st=${st} update=${update} onDone=${() => { update((s) => { s.candidateDone = true; }); setEditing(false); window.scrollTo({ top: 0 }); }} />`
          : html`<${Results} st=${st} update=${update} onEdit=${() => { setEditing(true); window.scrollTo({ top: 0 }); }} />`)
        : html`<${Admin} st=${st} update=${update} toast=${toast} />`}
    </main>
    <div aria-live="polite" className="pointer-events-none fixed inset-x-0 bottom-0 z-[60] flex justify-center p-4" style=${{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom, 0px))' }}>
      ${msg && html`<div className="pointer-events-auto rounded-xl bg-ink px-4 py-2.5 text-[15px] text-bg shadow-pop">${msg}</div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
