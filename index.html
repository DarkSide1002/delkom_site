/* ===================== Логика ===================== */
const STORE_KEY = 'pervaya-poziciya:v2-file';
const norm = (s) => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const fmtMoney = (n) => (n == null || n === '' ? '' : Number(n).toLocaleString('ru-RU'));
const fmtDate = (d) => { if (!d) return 'не указана'; const [y, m, dd] = d.split('-'); return `${dd}.${m}.${y}`; };

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return demoState();
    const s = JSON.parse(raw);
    const base = demoState();
    return Object.assign(base, s, { settings: Object.assign(base.settings, s.settings || {}, { weights: Object.assign(base.settings.weights, (s.settings || {}).weights || {}) }) });
  } catch (e) { return demoState(); }
}
function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* хранилище недоступно */ } }

/* ---- Грейды ---- */
const gradeById = (st, id) => st.grades.find((g) => g.id === id) || st.grades.find((g) => g.id === 'none');
function gradeLabel(st, from, to) {
  const a = gradeById(st, from), b = gradeById(st, to || from);
  if (!a || a.id === 'none') return 'не указан';
  if (!b || b.id === 'none' || a.id === b.id) return a.name;
  return `${a.name}–${b.name}`;
}
function candidateOrders(st, level) {
  if (!level) return [];
  if (level === 'lead') return ['lead', 'chief'].map((id) => gradeById(st, id).order);
  return [gradeById(st, level).order];
}
/** null — уровень вакансии не указан, true/false — попадание */
function gradeMatches(st, from, to, candLevel) {
  const a = gradeById(st, from), b = gradeById(st, to || from);
  if (!a || a.id === 'none') return null;
  const lo = a.order, hi = (!b || b.id === 'none') ? a.order : Math.max(a.order, b.order);
  const orders = candidateOrders(st, candLevel);
  if (!orders.length) return false;
  return orders.some((o) => o >= lo && o <= hi);
}

/* ---- Навыки кандидата ---- */
const findCandSkill = (cand, name) => cand.skills.find((s) => norm(s.name) === norm(name));
const findReq = (st, name) => st.reqs.find((r) => norm(r.name) === norm(name));
/** Подтверждённый уровень или null */
function confirmedLevel(cs) {
  if (!cs || cs.level == null || cs.level === '' || cs.evidence === 'none' || !cs.evidence) return null;
  return Number(cs.level);
}
function hasSubject(cand, subj) { return cand.subjects.some((s) => norm(s) === norm(subj)); }

/* ---- Балльная модель ----
   items: [{label, pts, kind}] — показываются пользователю как объяснение */
function scoreProfile(st, cand, { required, desired, subjects, gradeFrom, gradeTo, reqLevels = {} }) {
  const W = st.settings.weights;
  const items = []; let score = 0, max = 0, min = 0;
  const matchedReq = [], missingReq = [], matchedDes = [], missingDes = [];
  for (const name of required) {
    const cs = findCandSkill(cand, name);
    max += W.reqMatch; min += W.reqMiss;
    if (cs) {
      score += W.reqMatch; matchedReq.push(name);
      items.push({ label: `Обязательный навык «${name}» есть`, pts: W.reqMatch, kind: 'plus' });
      if (st.settings.useGap) {
        min += W.gap;
        const need = reqLevels[norm(name)] ?? (findReq(st, name) || {}).level;
        const have = confirmedLevel(cs);
        if (need != null && have != null && need - have >= 2) {
          score += W.gap;
          items.push({ label: `Разрыв по «${name}»: нужен «${SKILL_LEVELS[need]}», подтверждён «${SKILL_LEVELS[have]}»`, pts: W.gap, kind: 'gap' });
        }
      }
    } else {
      score += W.reqMiss; missingReq.push(name);
      items.push({ label: `Нет обязательного навыка «${name}»`, pts: W.reqMiss, kind: 'minus' });
    }
  }
  for (const name of desired) {
    const cs = findCandSkill(cand, name);
    max += W.desMatch; min += W.desMiss;
    if (cs) { score += W.desMatch; matchedDes.push(name); items.push({ label: `Желательный навык «${name}» есть`, pts: W.desMatch, kind: 'plus' }); }
    else { score += W.desMiss; missingDes.push(name); items.push({ label: `Нет желательного навыка «${name}»`, pts: W.desMiss, kind: 'minus' }); }
  }
  const matchedSubjects = [];
  for (const subj of subjects || []) {
    max += W.subject;
    if (hasSubject(cand, subj)) { score += W.subject; matchedSubjects.push(subj); items.push({ label: `Изучен предмет «${subj}»`, pts: W.subject, kind: 'plus' }); }
  }
  const gm = gradeMatches(st, gradeFrom, gradeTo, cand.level);
  if (gm === null) items.push({ label: 'Уровень позиции не указан — баллы за уровень не начисляются', pts: 0, kind: 'info' });
  else {
    max += W.grade;
    if (gm) { score += W.grade; items.push({ label: `Уровень совпадает (${gradeLabel(st, gradeFrom, gradeTo)})`, pts: W.grade, kind: 'plus' }); }
    else items.push({ label: `Уровень не совпадает (нужен ${gradeLabel(st, gradeFrom, gradeTo)})`, pts: 0, kind: 'info' });
  }
  const range = max - min || 1;
  const percent = Math.max(0, Math.min(100, Math.round(((score - min) / range) * 100)));
  return { score, max, min, percent, items, matchedReq, missingReq, matchedDes, missingDes, matchedSubjects, matches: matchedReq.length + matchedDes.length };
}

function scorePosition(st, cand, p) {
  return scoreProfile(st, cand, { required: p.required, desired: p.desired, subjects: p.subjects, gradeFrom: p.gradeFrom, gradeTo: p.gradeTo });
}
/** Навыки вакансии: категория обязательна, если хотя бы одно требование с ней — Must.
    Требования без категорий (образование, формат, статус) в расчёт не входят. */
function vacancySkills(vac) {
  const map = new Map();
  vac.requirements.forEach((x) => (x.skills || []).forEach((sk) => {
    const k = norm(sk); const e = map.get(k) || { name: sk, mandatory: false, unclearOnly: true, level: null, reqs: [] };
    e.mandatory = e.mandatory || x.mandatory; e.unclearOnly = e.unclearOnly && x.unclear; e.reqs.push(x);
    if (x.level != null && x.level !== '') e.level = Math.max(e.level ?? 0, Number(x.level));
    map.set(k, e);
  }));
  return [...map.values()];
}
function vacancyParts(vac) {
  const sk = vacancySkills(vac);
  const reqLevels = {};
  sk.forEach((x) => { if (x.level != null) reqLevels[norm(x.name)] = x.level; });
  return { required: sk.filter((x) => x.mandatory).map((x) => x.name), desired: sk.filter((x) => !x.mandatory).map((x) => x.name), reqLevels };
}
function scoreVacancy(st, cand, vac) {
  const pos = st.positions.find((p) => p.id === vac.positionId);
  const parts = vacancyParts(vac);
  return scoreProfile(st, cand, { ...parts, subjects: pos ? pos.subjects : [], gradeFrom: vac.gradeFrom, gradeTo: vac.gradeTo });
}
function vacancyStats(vac) {
  const total = vac.requirements.length;
  const mandatory = vac.requirements.filter((x) => x.mandatory).length;
  const unclear = vac.requirements.filter((x) => x.unclear).length;
  return {
    total, mandatory, desired: total - mandatory, unclear,
    unclearShare: total ? Math.round((unclear / total) * 100) : 0,
    hasUnclear: unclear > 0 ? 1 : 0,
    hasUnclearMandatory: vac.requirements.some((x) => x.unclear && x.mandatory) ? 1 : 0,
  };
}
function explain(res, title) {
  const parts = [];
  if (res.matchedReq.length) parts.push(`есть ${res.matchedReq.length} из ${res.matchedReq.length + res.missingReq.length} обязательных навыков`);
  if (res.matchedDes.length) parts.push(`${res.matchedDes.length} желательных`);
  if (res.matchedSubjects.length) parts.push(`изучены профильные предметы (${res.matchedSubjects.join(', ')})`);
  if (!parts.length) return `Для позиции «${title}» в профиле пока мало совпадений.`;
  return `Профиль подходит: ${parts.join(', ')}.`;
}

/* ---- Статус требования (декомпозиция) ---- */
function reqStatus(st, cand, name, mandatory, needLevel) {
  const lib = findReq(st, name);
  const cs = findCandSkill(cand, name);
  const need = needLevel != null && needLevel !== '' ? Number(needLevel) : (lib ? lib.level : null);
  const subs = lib ? lib.subtopics : [];
  const subRows = subs.map((s) => {
    const have = cs && cs.sub && cs.sub[s.id] != null && cs.sub[s.id] !== '' ? Number(cs.sub[s.id]) : null;
    const gap = have == null ? null : s.level - have;
    return { ...s, have, gap, mastered: have != null && have >= s.level };
  });
  const rated = subRows.filter((s) => s.have != null);
  const mastered = subRows.filter((s) => s.mastered).length;
  const critical = subRows.filter((s) => s.required && (s.have == null ? false : s.gap >= 2));
  const unratedMandatory = subRows.filter((s) => s.required && s.have == null);
  let color, text, next;
  if (!cs) {
    color = 'bad'; text = mandatory ? 'Навыка нет в профиле — существенный пробел' : 'Навыка нет в профиле';
    const course = lib && lib.courseIds[0] ? st.courses.find((c) => c.id === lib.courseIds[0]) : null;
    next = course ? `Начать с материала «${course.title}»` : 'Добавить навык в план обучения';
  } else if (rated.length) {
    const reqSubs = subRows.filter((s) => s.required);
    const reqMastered = reqSubs.filter((s) => s.mastered).length;
    if (critical.length) { color = 'bad'; text = `Критические пробелы: ${critical.map((s) => s.name).join(', ')}`; }
    else if (reqMastered === reqSubs.length && reqSubs.length) { color = 'ok'; text = 'Обязательные подтемы закрыты'; }
    else { color = 'warn'; text = 'Закрыто частично'; }
    const weakest = [...subRows].filter((s) => s.required && !s.mastered).sort((a, b) => (b.gap ?? 9) - (a.gap ?? 9))[0];
    next = weakest ? `Подтянуть «${weakest.name}» до уровня «${SKILL_LEVELS[weakest.level]}»` : 'Закрепить результат проектом в портфолио';
    if (unratedMandatory.length && color !== 'bad') next = `Оценить подтемы: ${unratedMandatory.slice(0, 3).map((s) => s.name).join(', ')}`;
  } else {
    const have = confirmedLevel(cs);
    if (have == null || need == null) {
      color = 'na'; text = cs.level != null && cs.level !== '' ? 'Уровень указан, но не подтверждён' : 'Недостаточно данных: уровень не указан';
      next = 'Подтвердить уровень тестом, проектом, опытом или ручной оценкой';
    } else if (have >= need) { color = 'ok'; text = 'Требование закрыто'; next = 'Оценить подтемы, чтобы найти слабые места'; }
    else if (need - have === 1) { color = 'warn'; text = 'Закрыто частично: не хватает одного уровня'; next = `Довести до уровня «${SKILL_LEVELS[need]}»`; }
    else { color = 'bad'; text = `Разрыв ${need - have} уровня`; next = `Довести до уровня «${SKILL_LEVELS[need]}»`; }
  }
  return {
    lib, cs, need, subRows, color, text, next, mastered, critical,
    share: subRows.length ? Math.round((mastered / subRows.length) * 100) : null,
    mandatorySubs: subRows.filter((s) => s.required), desiredSubs: subRows.filter((s) => !s.required),
  };
}

/* ---- Персональные рекомендации (7.1) ---- */
function buildRecommendations(st, cand, positionResults) {
  const relevant = positionResults.filter((x) => x.res.percent >= st.settings.trainingThreshold);
  const activeVac = st.vacancies.filter((v) => v.status === 'active');
  const map = new Map();
  const touch = (name) => { const k = norm(name); if (!map.has(k)) map.set(k, { name, mand: 0, des: 0, positions: [] }); return map.get(k); };
  for (const { p, res } of relevant) {
    res.missingReq.forEach((n) => { const e = touch(n); e.mand++; e.positions.push(p); });
    res.missingDes.forEach((n) => { const e = touch(n); e.des++; e.positions.push(p); });
    // навыки с разрывом уровня
    p.required.forEach((n) => {
      const cs = findCandSkill(cand, n), lib = findReq(st, n), have = confirmedLevel(cs);
      if (cs && lib && lib.level != null && have != null && lib.level - have >= 1) { const e = touch(n); e.mand++; e.positions.push(p); e.gapOnly = true; }
    });
  }
  const recs = [];
  for (const e of map.values()) {
    const lib = findReq(st, e.name);
    if (lib && lib.type === 'Soft') continue;
    const cs = findCandSkill(cand, e.name);
    const have = confirmedLevel(cs);
    const need = lib && lib.level != null ? lib.level : 2;
    const gap = Math.max(0, need - (cs ? (have ?? 0) : 0));
    const vacs = activeVac.filter((v) => v.requirements.some((x) => (x.skills || []).some((s) => norm(s) === norm(e.name))));
    const lowGrade = vacs.filter((v) => gradeById(st, v.gradeFrom).order > 0 && gradeById(st, v.gradeFrom).order <= 2).length;
    const alts = lib ? lib.alternatives : [];
    const hasAlt = alts.some((a) => findCandSkill(cand, a));
    const effort = lib && lib.effort ? lib.effort : 20;
    const parts = [
      { label: 'Обязательно в должностях', v: e.mand * 3 },
      { label: 'Желательно в должностях', v: e.des * 1 },
      { label: 'Встречается в активных вакансиях', v: +(vacs.length * 0.5).toFixed(1) },
      { label: 'Текущий разрыв уровня', v: gap },
      { label: 'Нужен на стартовых грейдах', v: +(lowGrade * 0.5).toFixed(1) },
      { label: 'Есть альтернативы', v: -(alts.length * 0.5) - (hasAlt ? 2 : 0) },
      { label: 'Трудоёмкость освоения', v: -+(effort / 40).toFixed(1) },
    ];
    const priority = +parts.reduce((a, b) => a + b.v, 0).toFixed(1);
    // влияние на соответствие: пересчёт с добавленным навыком
    const sim = JSON.parse(JSON.stringify(cand));
    const simSkill = findCandSkill(sim, e.name);
    if (simSkill) { simSkill.level = need; simSkill.evidence = 'manual'; }
    else sim.skills.push({ name: e.name, level: need, evidence: 'manual', sub: {} });
    let best = null;
    for (const p of [...new Set(e.positions)]) {
      const before = relevant.find((x) => x.p.id === p.id).res.percent;
      const after = scorePosition(st, sim, p).percent;
      if (!best || after - before > best.delta) best = { p, delta: after - before, before, after };
    }
    // приоритетная подтема
    let topSub = null;
    if (lib && lib.subtopics.length) {
      const subs = lib.subtopics.filter((s) => s.required).map((s) => {
        const h = cs && cs.sub && cs.sub[s.id] != null && cs.sub[s.id] !== '' ? Number(cs.sub[s.id]) : 0;
        return { ...s, gap: s.level - h };
      }).filter((s) => s.gap > 0).sort((a, b) => b.gap - a.gap);
      topSub = subs[0] || null;
    }
    const courses = st.courses
      .filter((c) => c.skills.some((s) => norm(s) === norm(e.name)) && c.availability !== 'недоступен')
      .sort((a, b) => (b.free - a.free) || ((b.rating || 0) - (a.rating || 0)));
    const course = (topSub && courses.find((c) => c.subtopics.some((s) => norm(s) === norm(topSub.name)))) || courses[0] || null;
    recs.push({
      name: e.name, lib, priority, parts, mand: e.mand, des: e.des, vacs, topSub, course, best, gap, need, hasAlt,
      positions: [...new Map(e.positions.map((p) => [p.id, p])).values()],
      why: e.mand ? `Обязательное требование в ${e.mand} ${plural(e.mand, 'должности', 'должностях', 'должностях')} из вашей подборки${vacs.length ? ` и встречается в ${vacs.length} ${plural(vacs.length, 'активной вакансии', 'активных вакансиях', 'активных вакансиях')}` : ''}.` : `Желательный навык, повышает соответствие в ${e.des} ${plural(e.des, 'должности', 'должностях', 'должностях')}.`,
      hours: course ? course.duration : effort,
    });
  }
  recs.sort((a, b) => b.priority - a.priority);
  const maxP = recs[0] ? recs[0].priority : 1;
  recs.forEach((r) => { r.tier = r.priority >= maxP * 0.66 ? 'high' : r.priority >= maxP * 0.33 ? 'mid' : 'low'; });
  return recs;
}
/** Похожие названия навыков — для подсказки при опечатке */
function similarSkills(st, name, limit = 3) {
  const a = norm(name); if (!a) return [];
  const dist = (x, y) => {
    const d = Array.from({ length: x.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= y.length; j++) d[0][j] = j;
    for (let i = 1; i <= x.length; i++) for (let j = 1; j <= y.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (x[i - 1] === y[j - 1] ? 0 : 1));
    return d[x.length][y.length];
  };
  return st.reqs.map((r) => {
    const b = norm(r.name);
    const score = b.includes(a) || a.includes(b) ? 0 : Math.min(dist(a, b), ...b.split(/\s+/).map((w) => dist(a, w)));
    return { name: r.name, score };
  }).filter((x) => x.score <= Math.max(2, Math.floor(a.length / 3))).sort((x, y) => x.score - y.score).slice(0, limit).map((x) => x.name);
}
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; }

/* ---- CSV ---- */
function toCSV(rows) {
  const esc = (x) => { const s = x == null ? '' : String(x); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\ufeff' + rows.map((r) => r.map(esc).join(';')).join('\n');
}

/* ---- Загрузка файлов через платформу ---- */
let downloadsApi = null;
const downloadsReady = (async () => {
  try { if (window.claude && window.claude.use) downloadsApi = await window.claude.use('downloads'); } catch (e) { downloadsApi = null; }
  return downloadsApi;
})();
async function offerFile(filename, data) {
  const api = await downloadsReady;
  if (!api) return { ok: false, msg: 'Скачивание файлов недоступно в этом просмотре' };
  try { await api.save({ filename, data }); return { ok: true, msg: `Файл ${filename} передан на сохранение` }; }
  catch (e) {
    if (e && e.code === 'declined') return { ok: false, msg: 'Сохранение отменено' };
    if (e && e.code === 'rate_limited') return { ok: false, msg: 'Окно сохранения уже открыто — попробуйте через пару секунд' };
    return { ok: false, msg: 'Не удалось сохранить файл' };
  }
}

const cx = (...a) => a.filter(Boolean).join(' ');

const ICONS = {
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z',
  edit: 'M4 20h4L19 9l-4-4L4 16v4Z M14 6l4 4',
  copy: 'M9 9h11v11H9z M5 15H4V4h11v1',
  trash: 'M4 7h16 M10 11v6 M14 11v6 M6 7l1 13h10l1-13 M9 7V4h6v3',
  ext: 'M14 4h6v6 M20 4l-9 9 M18 14v6H4V6h6',
  plus: 'M12 5v14 M5 12h14',
  x: 'M6 6l12 12 M18 6L6 18',
  up: 'M6 15l6-6 6 6',
  down: 'M6 9l6 6 6-6',
  chev: 'M9 6l6 6-6 6',
};
const Icon = ({ name, size = 16 }) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

function Btn({ kind = 'ghost', size = 'md', className, ...p }) {
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed';
  const sizes = { sm: 'h-8 px-2.5 text-sm', md: 'h-10 px-4 text-[15px]', icon: 'h-8 w-8' };
  const kinds = {
    primary: 'bg-accent text-onaccent hover:brightness-110',
    ghost: 'bg-surface text-ink border border-line hover:border-accent',
    quiet: 'text-ink hover:bg-sunken',
    danger: 'text-bad border border-line bg-surface hover:border-bad',
  };
  return html`<button type="button" className=${cx(base, sizes[size], kinds[kind], className)} ...${p} />`;
}
const IconBtn = ({ icon, label, ...p }) => html`<${Btn} size="icon" kind="quiet" title=${label} aria-label=${label} ...${p}><${Icon} name=${icon} /><//>`;

function Field({ label, hint, children, className }) {
  return html`<label className=${cx('flex flex-col gap-1 min-w-0', className)}>
    <span className="text-sm font-medium text-ink">${label}</span>
    ${children}
    ${hint && html`<span className="text-xs text-muted">${hint}</span>`}
  </label>`;
}
const inputCls = 'h-10 w-full rounded-lg border border-line bg-surface px-3 text-[15px] text-ink placeholder:text-muted focus:border-accent';
const Input = (p) => html`<input className=${inputCls} ...${p} />`;
const Textarea = (p) => html`<textarea className=${cx(inputCls, 'h-auto min-h-[84px] py-2')} ...${p} />`;
function Select({ value, onChange, options, placeholder, ...p }) {
  return html`<select className=${cx(inputCls, 'pr-8')} value=${value ?? ''} onChange=${(e) => onChange(e.target.value)} ...${p}>
    ${placeholder != null && html`<option value="">${placeholder}</option>`}
    ${options.map((o) => html`<option key=${o.id ?? o} value=${o.id ?? o}>${o.name ?? o}</option>`)}
  </select>`;
}
function Check({ checked, onChange, label }) {
  return html`<label className="inline-flex items-center gap-2 text-[15px] cursor-pointer select-none">
    <input type="checkbox" className="h-4 w-4 accent-[var(--accent)]" checked=${!!checked} onChange=${(e) => onChange(e.target.checked)} />
    <span>${label}</span></label>`;
}
function Chip({ children, tone = 'neutral', onRemove, active, onClick, title }) {
  const tones = {
    neutral: 'bg-sunken text-ink',
    ok: 'bg-oksoft text-ok', bad: 'bg-badsoft text-bad', warn: 'bg-warnsoft text-warn', na: 'bg-sunken text-muted',
    accent: 'bg-accentsoft text-accent',
  };
  const Tag = onClick ? 'button' : 'span';
  return html`<${Tag} type=${onClick ? 'button' : undefined} title=${title} onClick=${onClick} aria-pressed=${onClick ? !!active : undefined}
    className=${cx('inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-sm leading-6', active ? 'bg-accent text-onaccent' : tones[tone], onClick && 'border border-transparent hover:border-accent')}>
    ${children}
    ${onRemove && html`<button type="button" className="-mr-1 rounded p-0.5 hover:bg-line" aria-label="Удалить" onClick=${onRemove}><${Icon} name="x" size=${12} /></button>`}
  <//>`;
}
const YesNo = ({ v }) => html`<span className=${cx('inline-flex items-center gap-1 rounded px-1.5 text-sm', v ? 'bg-oksoft text-ok' : 'bg-sunken text-muted')}><b className="tabular-nums">${v ? 1 : 0}</b>${v ? 'Да' : 'Нет'}</span>`;
const Dot = ({ color }) => html`<span className=${cx('inline-block h-2.5 w-2.5 shrink-0 rounded-full', { ok: 'bg-ok', warn: 'bg-warn', bad: 'bg-bad', na: 'bg-na' }[color])} aria-hidden="true"></span>`;
const STATUS_NAME = { ok: 'закрыто', warn: 'частично', bad: 'пробел', na: 'нет данных' };

function TagInput({ values, onChange, suggestions = [], placeholder, listId }) {
  const [text, setText] = useState('');
  const inputRef = useRef(null);
  const add = (raw) => {
    const t = raw.trim(); if (!t) return;
    if (!values.some((x) => norm(x) === norm(t))) onChange([...values, t]);
    setText('');
  };
  return html`<div className="flex flex-col gap-2">
    <div className="flex gap-2">
      <input ref=${inputRef} className=${inputCls} list=${listId} value=${text} placeholder=${placeholder}
        onChange=${(e) => setText(e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(text); } }} />
      <${Btn} onClick=${() => add(text)} aria-label="Добавить"><${Icon} name="plus" /><//>
    </div>
    <datalist id=${listId}>${suggestions.map((s) => html`<option key=${s} value=${s} />`)}</datalist>
    ${values.length > 0 && html`<div className="flex flex-wrap gap-1.5">${values.map((v) => html`<span key=${v} className="inline-flex items-center rounded-md bg-sunken text-sm leading-6">
      <button type="button" className="rounded-l-md py-1 pl-2.5 pr-1 hover:text-accent" title="Нажмите, чтобы исправить"
        onClick=${() => { onChange(values.filter((x) => x !== v)); setText(v); if (inputRef.current) inputRef.current.focus(); }}>${v}</button>
      <button type="button" className="grid h-8 w-8 place-items-center rounded-r-md text-muted hover:bg-line hover:text-bad" aria-label=${`Удалить ${v}`} onClick=${() => onChange(values.filter((x) => x !== v))}><${Icon} name="x" size=${14} /></button>
    </span>`)}</div>
    <span className="text-xs text-muted">Нажмите на тег, чтобы исправить его, или на крестик, чтобы удалить.</span>`}
  </div>`;
}

function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k); document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, []);
  return html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-scrim p-0 sm:p-4" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div role="dialog" aria-modal="true" aria-label=${title} className=${cx('flex max-h-[92%] w-full flex-col rounded-t-2xl sm:rounded-2xl bg-surface shadow-pop', wide ? 'sm:max-w-4xl' : 'sm:max-w-xl')}>
      <div className="flex items-center justify-between gap-3 border-b border-line px-5 py-3">
        <h2 className="font-display text-lg font-semibold">${title}</h2>
        <${IconBtn} icon="x" label="Закрыть" onClick=${onClose} />
      </div>
      <div className="overflow-y-auto px-5 py-4">${children}</div>
      ${footer && html`<div className="flex flex-wrap justify-end gap-2 border-t border-line px-5 py-3">${footer}</div>`}
    </div>
  </div>`;
}

/** Полоса баллов: каждый сегмент — один пункт расчёта */
function ScoreStrip({ res, compact }) {
  const segs = res.items.filter((i) => i.pts !== 0);
  const total = segs.reduce((a, b) => a + Math.abs(b.pts), 0) || 1;
  const color = { plus: 'bg-ok', minus: 'bg-bad', gap: 'bg-warn' };
  return html`<div className="flex items-center gap-3">
    <div className=${cx('font-display font-semibold tabular-nums', compact ? 'text-xl w-14' : 'text-3xl w-20')}>${res.percent}<span className="text-base text-muted">%</span></div>
    <div className="flex-1 min-w-0">
      <div className="flex h-2.5 w-full gap-[2px] overflow-hidden rounded-full" role="img" aria-label=${`Соответствие ${res.percent}%: ${res.score} баллов из диапазона от ${res.min} до ${res.max}`}>
        ${segs.map((s, i) => html`<span key=${i} title=${`${s.label}: ${s.pts > 0 ? '+' : ''}${s.pts}`} className=${color[s.kind]} style=${{ width: (Math.abs(s.pts) / total) * 100 + '%' }}></span>`)}
      </div>
      ${!compact && html`<div className="mt-1 text-xs text-muted">${res.score} баллов, шкала от ${res.min} до ${res.max}</div>`}
    </div>
  </div>`;
}

function Breakdown({ res }) {
  return html`<ul className="mt-2 flex flex-col gap-1 text-sm">
    ${res.items.map((i, k) => html`<li key=${k} className="flex items-start justify-between gap-3">
      <span className=${i.kind === 'info' ? 'text-muted' : ''}>${i.label}</span>
      <b className=${cx('tabular-nums shrink-0', i.pts > 0 ? 'text-ok' : i.pts < 0 ? (i.kind === 'gap' ? 'text-warn' : 'text-bad') : 'text-muted')}>${i.pts > 0 ? '+' : ''}${i.pts}</b>
    </li>`)}
    <li className="mt-1 border-t border-line pt-1 text-xs text-muted">Соответствие = (баллы − минимум) ÷ (максимум − минимум). Веса меняются администратором в разделе «Настройки».</li>
  </ul>`;
}

function Disclosure({ label, children, defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return html`<div>
    <button type="button" className="inline-flex items-start gap-1 text-left text-sm font-medium text-accent hover:underline" aria-expanded=${open} onClick=${() => setOpen(!open)}>
      <span className=${cx('mt-[3px] shrink-0 transition-transform', open && 'rotate-90')}><${Icon} name="chev" size=${14} /></span><span>${label}</span>
    </button>
    ${open && html`<div className="mt-2">${children}</div>`}
  </div>`;
}

/* ===================== Декомпозиция требования (6.2) ===================== */
function ReqDecomp({ st, cand, req }) {
  const d = reqStatus(st, cand, req.name, req.mandatory, req.level);
  return html`<div className="rounded-xl border border-line p-3">
    <div className="flex items-start gap-2">
      <span className="mt-1.5"><${Dot} color=${d.color} /></span>
      <div className="min-w-0 flex-1">
        <div className="flex flex-wrap items-baseline gap-x-2">
          <b>${req.name}</b>
          <span className="text-sm text-muted">${req.mandatory ? 'обязательное' : 'желательное'}${d.need != null ? `, уровень «${SKILL_LEVELS[d.need]}»` : ', уровень не указан'}</span>
        </div>
        <div className="text-sm">${d.text}</div>
      </div>
    </div>
    ${d.subRows.length > 0 && html`<div className="mt-2 pl-[18px]"><${Disclosure} label=${`Подтемы: ${d.subRows.length} (обязательных ${d.mandatorySubs.length}, желательных ${d.desiredSubs.length})`}>
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr className="text-left text-muted"><th className="py-1 pr-2 font-medium">Подтема</th><th className="py-1 pr-2 font-medium">Нужно</th><th className="py-1 pr-2 font-medium">У вас</th><th className="py-1 font-medium">Статус</th></tr></thead>
        <tbody>${d.subRows.map((s) => {
          const c = s.have == null ? 'na' : s.mastered ? 'ok' : s.gap >= 2 && s.required ? 'bad' : 'warn';
          return html`<tr key=${s.id} className="border-t border-line">
            <td className="py-1 pr-2">${s.name}${!s.required && html`<span className="text-muted"> (желательно)</span>`}</td>
            <td className="py-1 pr-2 whitespace-nowrap">${SKILL_LEVELS[s.level]}</td>
            <td className="py-1 pr-2 whitespace-nowrap">${s.have == null ? html`<span className="text-muted">не оценено</span>` : SKILL_LEVELS[s.have]}</td>
            <td className="py-1"><span className="inline-flex items-center gap-1.5"><${Dot} color=${c} />${STATUS_NAME[c]}</span></td>
          </tr>`;
        })}</tbody>
      </table></div>
      <div className="mt-2 grid gap-1 text-sm">
        <div>Освоено подтем: <b>${d.mastered} из ${d.subRows.length}</b>${d.share != null && ` (${d.share}%)`}</div>
        ${d.critical.length > 0 && html`<div>Критические пробелы: <b className="text-bad">${d.critical.map((s) => s.name).join(', ')}</b></div>`}
      </div>
    <//></div>`}
    <div className="mt-2 pl-[18px] text-sm"><span className="text-muted">Следующий шаг: </span>${d.next}</div>
  </div>`;
}
const StatusLegend = () => html`<div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-muted">
  <span className="inline-flex items-center gap-1.5"><${Dot} color="ok" />требование закрыто</span>
  <span className="inline-flex items-center gap-1.5"><${Dot} color="warn" />закрыто частично</span>
  <span className="inline-flex items-center gap-1.5"><${Dot} color="bad" />существенный пробел</span>
  <span className="inline-flex items-center gap-1.5"><${Dot} color="na" />недостаточно данных</span>
</div>`;

/* ===================== Карточка вакансии ===================== */
function VacancyCard({ st, cand, vac, res, showDecompDefault }) {
  const src = st.sources.find((s) => s.id === vac.sourceId);
  const link = vac.url || (src && src.url) || '';
  const skills = vacancySkills(vac);
  const statusOf = useMemo(() => {
    const m = {}; skills.forEach((sk) => { m[norm(sk.name)] = reqStatus(st, cand, sk.name, sk.mandatory, sk.level); }); return m;
  }, [st, cand, vac]);
  const ReqLine = ({ x }) => html`<li className="py-1.5">
    <div className="flex flex-wrap items-baseline gap-x-2">
      <span>${x.name}</span>
      ${x.unclear && html`<span className="rounded bg-warnsoft px-1.5 text-xs text-warn" title="Формулировка неясная: не понятно, какой уровень или результат нужен">неясно</span>`}
      ${x.kind && x.kind !== 'Hard' && html`<span className="text-xs text-muted">${x.kind === 'Soft' ? 'soft skill' : x.kind}</span>`}
    </div>
    ${(x.skills || []).length > 0 && html`<div className="mt-1 flex flex-wrap gap-1">${x.skills.map((sk) => {
      const d = statusOf[norm(sk)];
      return html`<span key=${sk} className="inline-flex items-center gap-1.5 rounded-md bg-sunken px-1.5 text-[13px] leading-6" title=${d ? d.text : ''}><${Dot} color=${d ? d.color : 'na'} />${sk}</span>`;
    })}</div>`}
  </li>`;
  const must = vac.requirements.filter((x) => x.mandatory && (x.skills || []).length);
  const nice = vac.requirements.filter((x) => !x.mandatory && (x.skills || []).length);
  const other = vac.requirements.filter((x) => !(x.skills || []).length);
  const fmt = FORMATS.find((f) => f.id === vac.format);
  const salary = vac.salaryFrom || vac.salaryTo ? `${vac.salaryFrom ? 'от ' + fmtMoney(vac.salaryFrom) : ''} ${vac.salaryTo ? 'до ' + fmtMoney(vac.salaryTo) : ''} ₽`.trim() : 'зарплата не указана';
  const gl = gradeLabel(st, vac.gradeFrom, vac.gradeTo);
  const levelText = gl === gradeById(st, 'none').name && vac.levelSource ? `уровень не указан (в источнике: ${vac.levelSource})` : gl;
  return html`<article className="rounded-2xl border border-line bg-surface p-4 sm:p-5">
    <div className="flex flex-wrap items-start justify-between gap-3">
      <div className="min-w-0">
        <h3 className="font-display text-[17px] font-semibold leading-snug">${vac.title}</h3>
        <div className="mt-0.5 text-[15px]">${vac.company || html`<span className="text-muted">компания не указана</span>`}</div>
        <div className="mt-1 flex flex-wrap gap-1.5 text-sm">
          <${Chip}>${vac.sphere}${vac.subdirection && vac.subdirection !== vac.sphere ? ', ' + vac.subdirection : ''}<//>
          ${vac.city ? html`<${Chip}>${vac.city}<//>` : null}
          ${fmt && fmt.id !== 'unknown' ? html`<${Chip}>${fmt.name}<//>` : null}
          <${Chip}>${levelText}<//>
          ${vac.entry ? html`<${Chip} tone="accent">начальная позиция<//>` : null}
          ${vac.training ? html`<${Chip} tone="accent">есть обучение<//>` : null}
          ${vac.competition ? html`<${Chip} tone=${vac.competition === 'Высокая' ? 'warn' : 'neutral'}>конкуренция: ${vac.competition.toLowerCase()}<//>` : null}
        </div>
      </div>
      <div className="sm:text-right">
        <div className="font-semibold tabular-nums">${salary}</div>
        <div className="text-xs text-muted">${vac.published ? `опубликована ${fmtDate(vac.published)}` : 'дата публикации не указана'}</div>
      </div>
    </div>
    ${res && html`<div className="mt-3"><div className="text-xs text-muted mb-1">Соответствие профилю</div><${ScoreStrip} res=${res} compact /></div>`}
    <div className="mt-3 grid gap-2">
      ${must.length > 0 && html`<div><div className="text-sm font-medium">Обязательные требования (Must)</div><ul className="divide-y divide-line text-[15px]">${must.map((x) => html`<${ReqLine} key=${x.id} x=${x} />`)}</ul></div>`}
      ${nice.length > 0 && html`<div><div className="text-sm font-medium">Желательные (Nice to have)</div><ul className="divide-y divide-line text-[15px]">${nice.map((x) => html`<${ReqLine} key=${x.id} x=${x} />`)}</ul></div>`}
      ${other.length > 0 && html`<div><div className="text-sm font-medium">Прочие условия</div><p className="text-xs text-muted">Образование, формат, опыт — в расчёт соответствия не входят</p><ul className="divide-y divide-line text-[15px]">${other.map((x) => html`<${ReqLine} key=${x.id} x=${x} />`)}</ul></div>`}
    </div>
    ${skills.length > 0 && html`<div className="mt-3"><${Disclosure} label=${`Разбор по навыкам (${skills.length})`} defaultOpen=${showDecompDefault}>
      <div className="grid gap-2"><${StatusLegend} />${skills.map((sk) => html`<${ReqDecomp} key=${sk.name} st=${st} cand=${cand} req=${sk} />`)}</div>
    <//></div>`}
    <div className="mt-4 flex flex-wrap items-center gap-2">
      ${link ? html`<a className="inline-flex h-10 items-center gap-1.5 rounded-lg bg-accent px-4 text-[15px] font-medium text-onaccent hover:brightness-110" href=${link} target="_blank" rel="noopener noreferrer">Открыть вакансию <${Icon} name="ext" size=${14} /></a>`
        : html`<${Btn} kind="primary" disabled>Ссылка не указана<//>`}
      ${src && html`<span className="text-sm text-muted">Источник: ${src.url ? html`<a className="text-accent hover:underline" href=${src.url} target="_blank" rel="noopener noreferrer">${src.name}</a>` : src.name}</span>`}
    </div>
  </article>`;
}
/* ===================== Режим «Кандидат» ===================== */
const STEPS = ['О себе', 'Навыки', 'Учёба и опыт', 'Интересы'];

function Stepper({ step, setStep }) {
  return html`<ol className="flex gap-2 overflow-x-auto pb-1">
    ${STEPS.map((s, i) => html`<li key=${s} className="shrink-0">
      <button type="button" onClick=${() => setStep(i)} aria-current=${i === step ? 'step' : undefined}
        className=${cx('flex items-center gap-2 rounded-full border px-3 py-1.5 text-sm', i === step ? 'border-accent bg-accentsoft text-accent font-semibold' : 'border-line text-muted hover:text-ink')}>
        <span className=${cx('grid h-5 w-5 place-items-center rounded-full text-xs tabular-nums', i < step ? 'bg-ok text-onaccent' : i === step ? 'bg-accent text-onaccent' : 'bg-sunken')}>${i + 1}</span>${s}
      </button></li>`)}
  </ol>`;
}

function SkillRow({ st, skill, onChange, onRemove, duplicate }) {
  const lib = findReq(st, skill.name);
  const set = (patch) => onChange({ ...skill, ...patch });
  const similar = !lib && skill.name.trim() ? similarSkills(st, skill.name) : [];
  return html`<div className="rounded-xl border border-line p-3">
    <div className="flex items-center gap-2">
      <input className=${cx(inputCls, 'font-semibold', (!lib || duplicate) && 'border-warn')} aria-label="Название навыка" list="skill-list"
        value=${skill.name} onChange=${(e) => set({ name: e.target.value, sub: {} })} />
      <${Btn} kind="danger" size="sm" className="h-10 shrink-0" onClick=${onRemove} aria-label=${`Удалить навык ${skill.name}`}><${Icon} name="trash" /><span className="hidden min-[400px]:inline">Удалить</span><//>
    </div>
    ${duplicate && html`<p className="mt-1.5 text-sm text-warn">Этот навык уже есть в списке выше.</p>`}
    ${!lib && !duplicate && html`<div className="mt-1.5 text-sm">
      <span className="text-warn">Такого навыка нет в справочнике — в расчёте он не учитывается.</span>
      ${similar.length > 0 && html`<span className="text-muted"> Может, имелось в виду: </span>`}
      ${similar.map((n, k) => html`<${Fragment} key=${n}>${k > 0 && ', '}<button type="button" className="text-accent underline-offset-2 hover:underline" onClick=${() => set({ name: n, sub: {} })}>${n}</button><//>`)}
    </div>`}
    <div className="mt-2 grid gap-2 sm:grid-cols-2">
      <${Field} label="Уровень">
        <${Select} value=${skill.level ?? ''} placeholder="уровень не указан" options=${SKILL_LEVELS.map((n, i) => ({ id: String(i), name: `${i} — ${n}` }))} onChange=${(v) => set({ level: v === '' ? null : Number(v) })} />
      <//>
      <${Field} label="Чем подтверждён">
        <${Select} value=${skill.evidence || 'none'} options=${EVIDENCE} onChange=${(v) => set({ evidence: v })} />
      <//>
    </div>
    ${lib && lib.subtopics.length > 0 && html`<div className="mt-2"><${Disclosure} label=${`Оценить подтемы (${lib.subtopics.length})`}>
      <div className="grid gap-2 sm:grid-cols-2">
        ${lib.subtopics.map((s) => html`<${Field} key=${s.id} label=${s.name + (s.required ? '' : ' (желательно)')}>

function Wizard({ st, update, onDone }) {

        <div className="flex flex-wrap gap-1.5">${FORMATS.map((f) => html`<${Chip} key=${f.id} active=${cand.formats.includes(f.id)} onClick=${() => setC({ formats: toggle(cand.formats, f.id) })}>${f.name}<//>`)}</div>

        <div className="flex flex-wrap gap-1.5">${CANDIDATE_LEVELS.map((l) => html`<${Chip} key=${l.id} active=${cand.level === l.id} onClick=${() => setC({ level: cand.level === l.id ? '' : l.id })}>${l.name}<//>`)}</div>
      </div>
    </div>`,
    html`<div className="grid gap-3">
      <div className="flex gap-2">
        <input className=${inputCls} list="skill-list" value=${skillText} placeholder="SQL, Python, Бухучет и отчетность…" onChange=${(e) => setSkillText(e.target.value)}
          onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addSkill(skillText); } }} />
        <${Btn} kind="primary" onClick=${() => addSkill(skillText)}><${Icon} name="plus" />Добавить<//>
      </div>
      <datalist id="skill-list">${st.reqs.map((r) => html`<option key=${r.id} value=${r.name}>${r.type === 'Soft' ? 'soft skill' : r.category}</option>`)}</datalist>
      <p className="text-sm text-muted">Уровень учитывается в расчёте, только если указано, чем он подтверждён: тест, проект, опыт или ручная оценка. Если уровень не указан, система его не придумывает.</p>
      ${cand.skills.length === 0 && html`<div className="rounded-xl border border-dashed border-line p-4 text-sm text-muted">Добавьте хотя бы один навык — с ним подбор станет точнее.</div>`}
      <div className="grid gap-2 lg:grid-cols-2">
        ${cand.skills.map((sk, i) => html`<${SkillRow} key=${sk.id || 'i' + i} st=${st} skill=${sk}
          duplicate=${cand.skills.findIndex((x) => norm(x.name) === norm(sk.name)) < i}
          onChange=${(n) => update((s) => { s.candidate.skills[i] = n; })}
          onRemove=${() => update((s) => { s.candidate.skills.splice(i, 1); })} />`)}

    </div>`,
    html`<div className="grid gap-4">
      <${Field} label="Изученные предметы"><${TagInput} listId="subj-list" values=${cand.subjects} suggestions=${allSubjects} onChange=${(v) => setC({ subjects: v })} placeholder="Базы данных, Статистика…" /><//>
      <${Field} label="Пройденные курсы" hint="Название курса само по себе не подтверждает уровень навыка"><${TagInput} listId="course-list" values=${cand.courses} suggestions=${st.courses.map((c) => c.title)} onChange=${(v) => setC({ courses: v })} placeholder="Название курса" /><//>
      <div className="grid gap-4 sm:grid-cols-[1fr_180px]">

    <div className="mt-5"><${Stepper} step=${step} setStep=${setStep} /></div>
    <div className="mt-4 rounded-2xl border border-line bg-surface p-4 sm:p-6">

      <${Btn} onClick=${() => setStep(step - 1)} disabled=${step === 0}>Назад<//>
      ${step < STEPS.length - 1
        ? html`<${Btn} kind="primary" onClick=${() => setStep(step + 1)}>Далее<//>`

function VacanciesTab({ st, update }) {
  const cand = st.candidate;
  const [draft, setDraft] = useState(st.vacFilter);
  useEffect(() => setDraft(st.vacFilter), [st.vacFilter]);
  const f = st.vacFilter;
  const active = st.vacancies.filter((v) => v.status === 'active');
  const set = (patch) => setDraft({ ...draft, ...patch });
  const opts = (key) => [...new Set(active.map((v) => v[key]).filter(Boolean))].sort();
  const subdirs = [...new Set(active.filter((v) => !draft.sphere || v.sphere === draft.sphere).map((v) => v.subdirection).filter(Boolean))].sort();
  const allSkills = [...new Set(active.flatMap((v) => vacancySkills(v).filter((x) => x.mandatory).map((x) => x.name)))].sort((a, b) => a.localeCompare(b, 'ru'));

  const [onlySpheres, setOnlySpheres] = useState(false);
  const minMatch = st.settings.minVacancyMatch ?? 25;
  const lowCount = useRef(0);
  const list = useMemo(() => {
    const kw = norm(f.keywords);
    let out = active.filter((v) => {
      if (f.positionId && v.positionId !== f.positionId) return false;
      if (f.salaryFrom && !((v.salaryTo || v.salaryFrom || 0) >= Number(f.salaryFrom))) return false;
      if (f.salaryTo && !(v.salaryFrom != null && v.salaryFrom <= Number(f.salaryTo))) return false;
      if (f.city && v.city !== f.city) return false;
      if (f.format && v.format !== f.format) return false;
      if (f.level) { const g = gradeById(st, f.level).order, a = gradeById(st, v.gradeFrom), b = gradeById(st, v.gradeTo || v.gradeFrom); if (a.id === 'none' ? f.level !== 'none' : !(g >= a.order && g <= Math.max(a.order, b.order))) return false; }
      if (f.sphere && v.sphere !== f.sphere) return false;
      if (f.subdirection && v.subdirection !== f.subdirection) return false;
      if (f.entryOnly && !v.entry) return false;
      if (f.trainingOnly && !v.training) return false;
      if (f.company && v.company !== f.company) return false;
      if (f.excludeSkills.length && vacancySkills(v).some((x) => x.mandatory && f.excludeSkills.some((s) => norm(s) === norm(x.name)))) return false;
      if (kw && !norm([v.title, v.company, v.description, v.subdirection, ...v.requirements.map((x) => x.name + ' ' + (x.skills || []).join(' '))].join(' ')).includes(kw)) return false;
      return true;
    }).map((v) => ({ v, res: scoreVacancy(st, cand, v) }));
    lowCount.current = out.filter((x) => x.res.percent < minMatch).length;
    out = out.filter((x) => x.res.percent >= minMatch);
    const sorters = {
      match: (a, b) => b.res.percent - a.res.percent,
      salary: (a, b) => (b.v.salaryTo || b.v.salaryFrom || 0) - (a.v.salaryTo || a.v.salaryFrom || 0),
      date: (a, b) => String(b.v.published).localeCompare(String(a.v.published)),
      matches: (a, b) => b.res.matches - a.res.matches || b.res.percent - a.res.percent,
    };
    if (onlySpheres && cand.spheres.length) out = out.filter((x) => cand.spheres.includes(x.v.sphere));
    const pref = (x) => (cand.spheres.includes(x.v.sphere) ? 1 : 0);
    const cmp = sorters[f.sort] || sorters.match;
    return out.sort((a, b) => pref(b) - pref(a) || cmp(a, b));
  }, [st, f, onlySpheres]);

  const activeCount = Object.entries(f).filter(([k, val]) => k !== 'sort' && (Array.isArray(val) ? val.length : val)).length;
  const apply = () => update((s) => { s.vacFilter = { ...draft }; });
  const reset = () => { const e = { ...emptyVacFilter(), sort: f.sort }; setDraft(e); update((s) => { s.vacFilter = e; }); };
  const toggleEx = (n) => set({ excludeSkills: draft.excludeSkills.includes(n) ? draft.excludeSkills.filter((x) => x !== n) : [...draft.excludeSkills, n] });
  const [open, setOpen] = useState(typeof window !== 'undefined' && window.innerWidth >= 1024);

  return html`<div className="grid gap-5 lg:grid-cols-[300px_1fr] lg:items-start">
    <aside className="rounded-2xl border border-line bg-surface p-4 lg:sticky lg:top-20">
      <button type="button" className="flex w-full items-center justify-between font-display font-semibold" aria-expanded=${open} onClick=${() => setOpen(!open)}>
        <span>Фильтры${activeCount ? ` (${activeCount})` : ''}</span><span className=${cx('transition-transform', open ? '-rotate-90' : 'rotate-90')}><${Icon} name="chev" /></span>
      </button>
      ${open && html`<div className="mt-3 grid gap-3">
        <${Field} label="Должность"><${Select} value=${draft.positionId} placeholder="Любая" options=${st.positions.map((p) => ({ id: p.id, name: p.title }))} onChange=${(v) => set({ positionId: v })} /><//>
        <div className="grid grid-cols-2 gap-2">
          <${Field} label="Зарплата от"><${Input} type="number" inputMode="numeric" value=${draft.salaryFrom} onChange=${(e) => set({ salaryFrom: e.target.value })} /><//>
          <${Field} label="до"><${Input} type="number" inputMode="numeric" value=${draft.salaryTo} onChange=${(e) => set({ salaryTo: e.target.value })} /><//>
        </div>
        <${Field} label="Город"><${Select} value=${draft.city} placeholder="Любой" options=${opts('city')} onChange=${(v) => set({ city: v })} /><//>
        <${Field} label="Формат работы"><${Select} value=${draft.format} placeholder="Любой" options=${FORMATS} onChange=${(v) => set({ format: v })} /><//>
        <${Field} label="Уровень"><${Select} value=${draft.level} placeholder="Любой" options=${[...st.grades].sort((a, b) => a.order - b.order)} onChange=${(v) => set({ level: v })} /><//>
        <${Field} label="Сфера"><${Select} value=${draft.sphere} placeholder="Любая" options=${opts('sphere')} onChange=${(v) => set({ sphere: v, subdirection: '' })} /><//>
        <${Field} label="Поднаправление"><${Select} value=${draft.subdirection} placeholder="Любое" options=${subdirs} onChange=${(v) => set({ subdirection: v })} /><//>
        <${Field} label="Компания"><${Select} value=${draft.company} placeholder="Любая" options=${opts('company')} onChange=${(v) => set({ company: v })} /><//>
        <${Field} label="Ключевые слова"><${Input} value=${draft.keywords} onChange=${(e) => set({ keywords: e.target.value })} placeholder="SQL, банк, стажировка" /><//>
        <${Check} checked=${draft.entryOnly} onChange=${(v) => set({ entryOnly: v })} label="Только начальные позиции" />
        <${Check} checked=${draft.trainingOnly} onChange=${(v) => set({ trainingOnly: v })} label="Есть обучение" />
        <${Field} label="Без обязательного навыка" hint="Скрыть вакансии, где этот навык обязателен">
          <${Select} value="" placeholder="Выбрать навык" options=${allSkills.filter((n) => !draft.excludeSkills.includes(n))} onChange=${(n) => n && toggleEx(n)} />
        <//>
        ${draft.excludeSkills.length > 0 && html`<div className="flex flex-wrap gap-1.5">${draft.excludeSkills.map((n) => html`<${Chip} key=${n} tone="bad" onRemove=${() => toggleEx(n)}>без: ${n}<//>`)}</div>`}
        <div className="flex gap-2 pt-1">
          <${Btn} kind="primary" className="flex-1" onClick=${apply}>Применить фильтры<//>
          <${Btn} onClick=${reset}>Сбросить фильтры<//>
        </div>
      </div>`}
    </aside>
    <div className="min-w-0">
      <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1">
          <div aria-live="polite"><span className="font-medium">Найдено: ${list.length} ${plural(list.length, 'вакансия', 'вакансии', 'вакансий')}</span>
            ${lowCount.current > 0 && html`<span className="block text-sm text-muted">Скрыто ${lowCount.current} с соответствием ниже ${minMatch}%</span>`}</div>
          ${cand.spheres.length > 0 && html`<${Check} checked=${onlySpheres} onChange=${setOnlySpheres} label=${'Только ' + cand.spheres.join(', ').toLowerCase()} />`}
        </div>
        <label className="flex items-center gap-2 text-sm"><span className="text-muted">Сортировка</span>
          <select className=${cx(inputCls, 'h-9 w-auto')} value=${f.sort} onChange=${(e) => update((s) => { s.vacFilter.sort = e.target.value; })}>
            <option value="match">по соответствию</option><option value="salary">по зарплате</option><option value="date">по дате публикации</option><option value="matches">по количеству совпадений</option>
          </select></label>
      </div>
      ${list.length === 0 ? html`<div className="rounded-2xl border border-dashed border-line p-6 text-center">
          <div className="font-medium">${lowCount.current ? `Нет вакансий с соответствием от ${minMatch}%` : 'По этим фильтрам вакансий нет'}</div>
          <p className="mt-1 text-sm text-muted">${lowCount.current ? 'Добавьте в анкету навыки, которые у вас есть, или ослабьте фильтры.' : 'Расширьте зарплатный диапазон, уберите город или исключённые требования.'}</p>
          <${Btn} className="mt-3" onClick=${reset}>Сбросить фильтры<//>
        </div>`
        : html`<div className="grid gap-3">${list.map(({ v, res }) => html`<${VacancyCard} key=${v.id} st=${st} cand=${cand} vac=${v} res=${res} />`)}</div>`}
    </div>
  </div>`;
}

const SecHead = ({ title, children, sub }) => html`<div className="mb-4 flex flex-wrap items-end justify-between gap-3">

const nextId = (list, prefix, start, pad = 3) => prefix + String(Math.max(start, ...list.map((x) => parseInt(String(x.id).replace(/\D/g, ''), 10) || 0)) + 1).padStart(pad, '0');
const lines = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean);

/* ---------- 4.1 Таблица вакансий ---------- */

  { k: 'city', t: 'Город', get: (v) => v.city, show: (v) => v.city || '—' },

  { k: 'total', t: 'Требований', get: (v, st, s) => s.total, num: true },
  { k: 'mandatory', t: 'Обязательных', get: (v, st, s) => s.mandatory, num: true },
  { k: 'desired', t: 'Желательных', get: (v, st, s) => s.desired, num: true },
  { k: 'unclear', t: 'Неясных', get: (v, st, s) => s.unclear, num: true },
  { k: 'unclearShare', t: 'Доля неясных', get: (v, st, s) => s.unclearShare, show: (v, st, s) => s.unclearShare + '%', num: true },
  { k: 'hasUnclear', t: 'Есть неясное', get: (v, st, s) => s.hasUnclear, bin: true, num: true },
  { k: 'hasUnclearMandatory', t: 'Неясное обязательное', get: (v, st, s) => s.hasUnclearMandatory, bin: true, num: true },
  { k: 'competition', t: 'Конкуренция', get: (v) => COMPETITION_ORDER[v.competition] ?? 0, show: (v) => v.competition || '—', num: true },
  { k: 'status', t: 'Статус', get: (v) => v.status, show: (v) => (VAC_STATUSES.find((x) => x.id === v.status) || {}).name },
  { k: 'updated', t: 'Обновлено', get: (v) => v.updated || '', show: (v) => fmtDate(v.updated), num: true },
  { k: 'url', t: 'Источник', get: (v) => v.sourceId },
];

function VacanciesAdmin({ st, update, toast }) {
  const [q, setQ] = useState('');
  const [fl, setFl] = useState({ level: '', status: '', unclear: '', mandatory: '', source: '' });
  const [sort, setSort] = useState({ k: 'id', dir: 1 });
  const [sel, setSel] = useState([]);
  const [page, setPage] = useState(0);
  const [bulkStatus, setBulkStatus] = useState('');
  const [edit, setEdit] = useState(null);
  const [view, setView] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [canSave, setCanSave] = useState(false);
  useEffect(() => { downloadsReady.then((a) => setCanSave(!!a)); }, []);

  const rows = useMemo(() => {
    const nq = norm(q);
    return st.vacancies.map((v) => ({ v, s: vacancyStats(v) })).filter(({ v, s }) => {
      if (nq && !norm([v.id, v.extId, v.title, v.company, v.city, v.sphere, v.subdirection].join(' ')).includes(nq)) return false;
      if (fl.level) {
        const g = gradeById(st, fl.level), a = gradeById(st, v.gradeFrom), b = gradeById(st, v.gradeTo || v.gradeFrom);
        if (g.id === 'none' ? a.id !== 'none' : (a.id === 'none' || g.order < a.order || g.order > Math.max(a.order, b.order))) return false;
      }
      if (fl.status && v.status !== fl.status) return false;
      if (fl.unclear !== '' && String(s.hasUnclear) !== fl.unclear) return false;
      if (fl.mandatory !== '' && String(s.mandatory > 0 ? 1 : 0) !== fl.mandatory) return false;
      if (fl.source && v.sourceId !== fl.source) return false;
      return true;
    }).sort((a, b) => {
      const col = VAC_COLS.find((c) => c.k === sort.k);
      const x = col.get(a.v, st, a.s), y = col.get(b.v, st, b.s);
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ru')) * sort.dir;
    });
  }, [st, q, fl, sort]);
  const ps = st.settings.pageSize || 12;
  const pages = Math.max(1, Math.ceil(rows.length / ps));
  const pg = Math.min(page, pages - 1);
  const shown = rows.slice(pg * ps, pg * ps + ps);
  const allShownSel = shown.length > 0 && shown.every((r) => sel.includes(r.v.id));

  const exportCsv = async () => {
    const head = VAC_COLS.map((c) => c.t).concat('Ссылка');
    head.push('Проверка дубликатов');
    const body = rows.map(({ v, s }) => VAC_COLS.map((c) => (c.k === 'url' ? (st.sources.find((x) => x.id === v.sourceId) || {}).name : c.k === 'title' ? v.title : c.bin ? c.get(v, st, s) : c.show ? c.show(v, st, s) : c.get(v, st, s))).concat(v.url || '', v.dupNote || ''));
    const r = await offerFile(`vakansii-${TODAY}.csv`, toCSV([head, ...body]));
    toast(r.msg);
  };
  const duplicate = (v) => update((s) => {
    const copy = JSON.parse(JSON.stringify(v));
    copy.id = nextId(s.vacancies, 'V', 0); copy.extId = ''; copy.dupNote = ''; copy.title += ' (копия)'; copy.status = 'draft'; copy.updated = TODAY;
    copy.requirements.forEach((x) => { x.id = uid(); });
    s.vacancies.unshift(copy);
  });
  const saveVac = (vac) => {
    update((s) => {
      vac.updated = TODAY;
      const i = s.vacancies.findIndex((x) => x.id === vac.id);
      if (i >= 0) s.vacancies[i] = vac; else s.vacancies.unshift(vac);
    });
    setEdit(null); toast('Вакансия сохранена');
  };
  const SortTh = ({ col }) => {
    const on = sort.k === col.k;
    return html`<th className="whitespace-nowrap px-2 py-2 text-left font-medium" aria-sort=${on ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}>
      <button type="button" className=${cx('inline-flex items-center gap-0.5 hover:text-accent', on && 'text-accent')} onClick=${() => setSort({ k: col.k, dir: on ? -sort.dir : 1 })}>
        ${col.t}<span className="w-3">${on ? (sort.dir > 0 ? '↑' : '↓') : ''}</span></button></th>`;
  };

  return html`<div>
    <${SecHead} title="Вакансии" sub="Бинарные поля хранятся как 1 или 0, рядом показана подпись «Да» или «Нет».">
      ${canSave && html`<${Btn} onClick=${exportCsv}>Экспорт CSV<//>`}
      <${Btn} kind="primary" onClick=${() => setEdit(blankVacancy(st))}><${Icon} name="plus" />Добавить вакансию<//>
    <//>
    <div className="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-6">
      <div className="col-span-2 sm:col-span-3 lg:col-span-1"><${Input} type="search" placeholder="Поиск" aria-label="Поиск по вакансиям" value=${q} onChange=${(e) => { setQ(e.target.value); setPage(0); }} /></div>
      <${Select} aria-label="Уровень" value=${fl.level} placeholder="Любой уровень" options=${[...st.grades].sort((a, b) => a.order - b.order)} onChange=${(v) => setFl({ ...fl, level: v })} />
      <${Select} aria-label="Статус" value=${fl.status} placeholder="Любой статус" options=${VAC_STATUSES} onChange=${(v) => setFl({ ...fl, status: v })} />
      <${Select} aria-label="Неясные требования" value=${fl.unclear} placeholder="Неясные: все" options=${[{ id: '1', name: 'Есть неясные (1)' }, { id: '0', name: 'Нет неясных (0)' }]} onChange=${(v) => setFl({ ...fl, unclear: v })} />
      <${Select} aria-label="Обязательные требования" value=${fl.mandatory} placeholder="Обязательные: все" options=${[{ id: '1', name: 'Есть обязательные (1)' }, { id: '0', name: 'Нет обязательных (0)' }]} onChange=${(v) => setFl({ ...fl, mandatory: v })} />
      <${Select} aria-label="Источник" value=${fl.source} placeholder="Любой источник" options=${st.sources} onChange=${(v) => setFl({ ...fl, source: v })} />
    </div>
    ${sel.length > 0 && html`<div className="mt-3 flex flex-wrap items-center gap-2 rounded-xl bg-accentsoft p-2.5">
      <b className="text-accent px-1">Выбрано: ${sel.length}</b>
      <div className="w-44"><${Select} aria-label="Новый статус" value=${bulkStatus} placeholder="Новый статус" options=${VAC_STATUSES} onChange=${setBulkStatus} /></div>
      <${Btn} kind="primary" disabled=${!bulkStatus} onClick=${() => { update((s) => s.vacancies.forEach((v) => { if (sel.includes(v.id)) { v.status = bulkStatus; v.updated = TODAY; } })); toast(`Статус изменён у ${sel.length} ${plural(sel.length, 'вакансии', 'вакансий', 'вакансий')}`); setSel([]); }}>Изменить статус<//>
      <${Btn} kind="quiet" onClick=${() => setSel([])}>Снять выбор<//>
    </div>`}
    <div className="mt-3 overflow-x-auto rounded-xl border border-line bg-surface">
      <table className="w-full text-sm">
        <thead className="bg-sunken text-muted"><tr>
          <th className="px-2 py-2"><input type="checkbox" aria-label="Выбрать все на странице" className="h-4 w-4 accent-[var(--accent)]" checked=${allShownSel}
            onChange=${(e) => setSel(e.target.checked ? [...new Set([...sel, ...shown.map((r) => r.v.id)])] : sel.filter((id) => !shown.some((r) => r.v.id === id)))} /></th>
          ${VAC_COLS.map((c) => (c.num || c.k === 'id' ? html`<${SortTh} key=${c.k} col=${c} />` : html`<th key=${c.k} className="whitespace-nowrap px-2 py-2 text-left font-medium">${c.t}</th>`))}
          <th className="px-2 py-2 text-left font-medium">Действия</th>
        </tr></thead>
        <tbody>
          ${shown.length === 0 && html`<tr><td colSpan=${VAC_COLS.length + 2} className="p-6 text-center text-muted">Ничего не найдено. Измените поиск или фильтры.</td></tr>`}
          ${shown.map(({ v, s }) => {
            const src = st.sources.find((x) => x.id === v.sourceId);
            const link = v.url || (src && src.url);
            return html`<tr key=${v.id} className=${cx('border-t border-line', sel.includes(v.id) && 'bg-accentsoft')}>
              <td className="px-2 py-1.5"><input type="checkbox" aria-label=${`Выбрать ${v.id}`} className="h-4 w-4 accent-[var(--accent)]" checked=${sel.includes(v.id)} onChange=${(e) => setSel(e.target.checked ? [...sel, v.id] : sel.filter((x) => x !== v.id))} /></td>
              ${VAC_COLS.map((c) => html`<td key=${c.k} className=${cx('px-2 py-1.5', c.k === 'title' ? 'min-w-[200px]' : 'whitespace-nowrap', c.num && !c.bin && 'tabular-nums')}>
                ${c.bin ? html`<${YesNo} v=${c.get(v, st, s)} />`
                  : c.k === 'url' ? (src ? (link ? html`<a className="text-accent hover:underline" href=${link} target="_blank" rel="noopener noreferrer">${src.name}</a>` : src.name) : '—')
                  : c.k === 'status' ? html`<span className=${cx('rounded px-1.5', v.status === 'active' ? 'bg-oksoft text-ok' : v.status === 'paused' ? 'bg-warnsoft text-warn' : 'bg-sunken text-muted')}>${c.show(v)}</span>`
                  : c.show ? c.show(v, st, s) : c.get(v, st, s)}
              </td>`)}
              <td className="px-1 py-1 whitespace-nowrap">
                <${IconBtn} icon="eye" label="Просмотр" onClick=${() => setView(v)} />
                <${IconBtn} icon="edit" label="Редактировать" onClick=${() => setEdit(JSON.parse(JSON.stringify(v)))} />
                <${IconBtn} icon="copy" label="Дублировать" onClick=${() => { duplicate(v); toast('Создана копия-черновик'); }} />
                <${IconBtn} icon="trash" label="Удалить" onClick=${() => setConfirmDel(v)} />
                ${link ? html`<a className="inline-grid h-8 w-8 place-items-center rounded-lg hover:bg-sunken" href=${link} target="_blank" rel="noopener noreferrer" title="Открыть источник" aria-label="Открыть источник"><${Icon} name="ext" /></a>` : html`<${IconBtn} icon="ext" label="Ссылка не указана" disabled />`}
              </td>
            </tr>`;
          })}
        </tbody>
      </table>
    </div>
    <div className="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm">
      <span className="text-muted">Показано ${shown.length ? pg * ps + 1 : 0}–${pg * ps + shown.length} из ${rows.length}</span>
      <div className="flex items-center gap-1">
        <${Btn} size="sm" disabled=${pg === 0} onClick=${() => setPage(pg - 1)}>Назад<//>
        ${Array.from({ length: pages }, (_, i) => i).filter((i) => i === 0 || i === pages - 1 || Math.abs(i - pg) <= 1).map((i, k, arr) => html`<${Fragment} key=${i}>${k > 0 && i - arr[k - 1] > 1 && html`<span className="px-1 text-muted">…</span>`}<${Btn} size="sm" kind=${i === pg ? 'primary' : 'quiet'} onClick=${() => setPage(i)} aria-label=${`Страница ${i + 1}`}>${i + 1}<//><//>`)}
        <${Btn} size="sm" disabled=${pg >= pages - 1} onClick=${() => setPage(pg + 1)}>Вперёд<//>
      </div>
    </div>
    ${edit && html`<${VacancyForm} st=${st} vac=${edit} onClose=${() => setEdit(null)} onSave=${saveVac} />`}
    ${view && html`<${Modal} wide title=${view.id + ': ' + view.title} onClose=${() => setView(null)}>
      ${!st.candidateDone && html`<p className="mb-3 text-sm text-muted">Статусы требований считаются по анкете кандидата — она пока не заполнена.</p>`}
      <${VacancyCard} st=${st} cand=${st.candidate} vac=${view} res=${st.candidateDone ? scoreVacancy(st, st.candidate, view) : null} showDecompDefault=${true} />
      ${view.description && html`<p className="mt-3 text-sm">${view.description}</p>`}
    <//>`}
    ${confirmDel && html`<${Modal} title="Удалить вакансию?" onClose=${() => setConfirmDel(null)} footer=${html`
      <${Btn} onClick=${() => setConfirmDel(null)}>Отмена<//>
      <${Btn} kind="danger" onClick=${() => { update((s) => { s.vacancies = s.vacancies.filter((x) => x.id !== confirmDel.id); }); setSel(sel.filter((x) => x !== confirmDel.id)); setConfirmDel(null); toast('Вакансия удалена'); }}>Удалить<//>`}>
      <p>«${confirmDel.title}» (${confirmDel.company}) будет удалена из базы. Это действие нельзя отменить.</p>
    <//>`}
  </div>`;
}

function blankVacancy(st) {
  return { id: nextId(st.vacancies, 'V', 0), extId: '', levelSource: '', dupNote: '', positionId: '', title: '', company: '', sphere: '', subdirection: '', gradeFrom: 'none', gradeTo: 'none', city: '', format: 'unknown', salaryFrom: null, salaryTo: null, entry: 0, training: 0, competition: null, status: 'draft', published: TODAY, updated: TODAY, sourceId: '', url: '', description: '', requirements: [] };
}

function VacancyForm({ st, vac, onClose, onSave }) {
  const [v, setV] = useState(vac);
  const set = (patch) => setV({ ...v, ...patch });
  const setReq = (i, patch) => { const r = [...v.requirements]; r[i] = { ...r[i], ...patch }; set({ requirements: r }); };
  const numOrNull = (x) => (x === '' || x == null ? null : Number(x));
  const grades = [...st.grades].sort((a, b) => a.order - b.order);
  const valid = v.title.trim() && v.company.trim();
  return html`<${Modal} wide title=${st.vacancies.some((x) => x.id === vac.id) ? `Редактирование ${vac.id}` : 'Новая вакансия'} onClose=${onClose}
    footer=${html`<${Btn} onClick=${onClose}>Отмена<//><${Btn} kind="primary" disabled=${!valid} onClick=${() => onSave(v)}>Сохранить<//>`}>
    <div className="grid gap-3 sm:grid-cols-2">
      <${Field} label="Название должности"><${Input} value=${v.title} onChange=${(e) => set({ title: e.target.value })} /><//>
      <${Field} label="Компания"><${Input} value=${v.company} onChange=${(e) => set({ company: e.target.value })} /><//>
      <${Field} label="Профиль должности" hint="Нужен для учёта профильных предметов"><${Select} value=${v.positionId} placeholder="Не связан" options=${st.positions.map((p) => ({ id: p.id, name: p.title }))}
        onChange=${(id) => { const p = st.positions.find((x) => x.id === id); set(p ? { positionId: id, sphere: v.sphere || p.sphere, subdirection: v.subdirection || p.subdirection } : { positionId: id }); }} /><//>
      <${Field} label="Сфера"><${Select} value=${v.sphere} placeholder="Не указана" options=${SPHERES} onChange=${(x) => set({ sphere: x })} /><//>
      <${Field} label="Поднаправление"><${Input} value=${v.subdirection} onChange=${(e) => set({ subdirection: e.target.value })} /><//>
      <div className="grid grid-cols-2 gap-2">
        <${Field} label="Грейд от"><${Select} value=${v.gradeFrom} options=${grades} onChange=${(x) => set({ gradeFrom: x, gradeTo: x === 'none' ? 'none' : (v.gradeTo === 'none' || gradeById(st, v.gradeTo).order < gradeById(st, x).order ? x : v.gradeTo) })} /><//>
        <${Field} label="до"><${Select} value=${v.gradeTo} options=${grades.filter((g) => v.gradeFrom === 'none' ? g.id === 'none' : g.order >= gradeById(st, v.gradeFrom).order)} onChange=${(x) => set({ gradeTo: x })} /><//>
      </div>
      <${Field} label="Город"><${Input} value=${v.city} onChange=${(e) => set({ city: e.target.value })} /><//>
      <${Field} label="Формат работы"><${Select} value=${v.format} options=${FORMATS} onChange=${(x) => set({ format: x })} /><//>
      <div className="grid grid-cols-2 gap-2">
        <${Field} label="Зарплата от, ₽"><${Input} type="number" value=${v.salaryFrom ?? ''} onChange=${(e) => set({ salaryFrom: numOrNull(e.target.value) })} /><//>
        <${Field} label="до, ₽"><${Input} type="number" value=${v.salaryTo ?? ''} onChange=${(e) => set({ salaryTo: numOrNull(e.target.value) })} /><//>
      </div>
      <${Field} label="Конкуренция из источника"><${Select} value=${v.competition || ''} placeholder="Нет данных" options=${COMPETITION} onChange=${(x) => set({ competition: x || null })} /><//>
      <${Field} label="Уровень из источника" hint="Как написано в вакансии"><${Input} value=${v.levelSource || ''} onChange=${(e) => set({ levelSource: e.target.value })} /><//>
      <${Field} label="Статус"><${Select} value=${v.status} options=${VAC_STATUSES} onChange=${(x) => set({ status: x })} /><//>
      <${Field} label="Дата публикации" hint="Пусто — не указана"><${Input} type="date" value=${v.published || ''} onChange=${(e) => set({ published: e.target.value })} /><//>
      <${Field} label="Источник"><${Select} value=${v.sourceId} placeholder="Не указан" options=${st.sources} onChange=${(x) => set({ sourceId: x })} /><//>
      <${Field} label="Ссылка на вакансию"><${Input} type="url" value=${v.url} onChange=${(e) => set({ url: e.target.value })} placeholder="https://" /><//>
      <div className="flex flex-wrap gap-4 sm:col-span-2">
        <${Check} checked=${!!v.entry} onChange=${(x) => set({ entry: x ? 1 : 0 })} label="Начальная позиция (1/0)" />
        <${Check} checked=${!!v.training} onChange=${(x) => set({ training: x ? 1 : 0 })} label="Есть обучение (1/0)" />
      </div>
      <${Field} className="sm:col-span-2" label="Описание"><${Textarea} value=${v.description} onChange=${(e) => set({ description: e.target.value })} /><//>

    <p className="text-sm text-muted">Соответствие считается по категориям навыков. Требование без категорий (образование, формат, статус) показывается кандидату, но в баллы не входит.</p>
    <div className="mt-2 grid gap-2">
      ${v.requirements.map((x, i) => html`<div key=${x.id} className="grid gap-2 rounded-lg border border-line p-2.5">
        <div className="flex items-start gap-2">
          <span className="mt-2.5 w-12 shrink-0 text-xs text-muted tabular-nums">${x.id.length < 8 ? x.id : ''}</span>
          <div className="flex-1"><${Textarea} aria-label="Требование из источника" value=${x.name} onChange=${(e) => setReq(i, { name: e.target.value })} style=${{ minHeight: '44px' }} /></div>
          <${IconBtn} icon="trash" label="Удалить требование" onClick=${() => set({ requirements: v.requirements.filter((_, k) => k !== i) })} />
        </div>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 sm:pl-14">
          <${Check} checked=${x.mandatory} onChange=${(c) => setReq(i, { mandatory: c })} label="Must" />
          <${Check} checked=${x.unclear} onChange=${(c) => setReq(i, { unclear: c })} label="Неясно" />
          <div className="w-32"><${Select} aria-label="Тип" value=${x.kind || 'Hard'} options=${['Hard', 'Soft', 'Стаж']} onChange=${(c) => setReq(i, { kind: c })} /></div>
          <div className="w-44"><${Select} aria-label="Требуемый уровень" value=${x.level == null ? '' : String(x.level)} placeholder="уровень не указан" options=${SKILL_LEVELS.map((n, k) => ({ id: String(k), name: n }))} onChange=${(c) => setReq(i, { level: c === '' ? null : Number(c) })} /></div>
        </div>
        <div className="sm:pl-14"><${TagInput} listId="req-names" values=${x.skills || []} suggestions=${st.reqs.map((r) => r.name)} onChange=${(sk) => setReq(i, { skills: sk })} placeholder="Категория навыка, например SQL" /></div>
      </div>`)}
      <div><${Btn} onClick=${() => set({ requirements: [...v.requirements, { id: uid(), name: '', skills: [], kind: 'Hard', mandatory: true, unclear: false, level: null }] })}><${Icon} name="plus" />Добавить требование<//></div>
    </div>
  <//>`;
}

/* ---------- Требования и должности ---------- */
function ReqsAdmin({ st, update, toast, openDecomp }) {
  const [tab, setTab] = useState('reqs');
  const [q, setQ] = useState('');
  const [edit, setEdit] = useState(null);
  const [editPos, setEditPos] = useState(null);
  const usage = (name) => st.vacancies.filter((v) => v.requirements.some((x) => (x.skills || []).some((s) => norm(s) === norm(name)))).length;
  const reqs = st.reqs.filter((r) => !q || norm(r.name + r.category).includes(norm(q))).sort((a, b) => usage(b.name) - usage(a.name));
  const saveReq = (r, oldName) => {
    update((s) => {
      r.updated = TODAY;
      const i = s.reqs.findIndex((x) => x.id === r.id);
      if (i >= 0) s.reqs[i] = r; else s.reqs.push(r);
      if (oldName && norm(oldName) !== norm(r.name)) {
        const ren = (n) => (norm(n) === norm(oldName) ? r.name : n);
        s.positions.forEach((p) => { p.required = p.required.map(ren); p.desired = p.desired.map(ren); });
        s.vacancies.forEach((v) => v.requirements.forEach((x) => { x.skills = (x.skills || []).map(ren); }));
        s.courses.forEach((c) => { c.skills = c.skills.map(ren); });
        s.candidate.skills.forEach((x) => { x.name = ren(x.name); });
      }
    });
    setEdit(null); toast('Требование сохранено');
  };
  const savePos = (p) => { p.basis = ''; update((s) => { const i = s.positions.findIndex((x) => x.id === p.id); if (i >= 0) s.positions[i] = p; else s.positions.push(p); }); setEditPos(null); toast('Должность сохранена'); };
  return html`<div>
    <${SecHead} title="Требования" sub=${tab === 'reqs' ? 'Категории навыков из файла анализа вакансий. Для основных навыков добавлены подтемы, курсы и задания.' : 'Профили должностей собраны по группам вакансий из файла: навык обязателен, если он Must в половине вакансий группы и более; желателен — если встречается в 30% и более.'}>

    const out = { ...r, projects: lines(r._projects), questions: lines(r._questions), tasks: lines(r._tasks) };

      <${Field} label="Уровень владения"><${Select} value=${r.level == null ? '' : String(r.level)} placeholder="уровень не указан" options=${SKILL_LEVELS.map((n, i) => ({ id: String(i), name: `${i} — ${n}` }))} onChange=${(v) => set({ level: v === '' ? null : Number(v) })} /><//>
